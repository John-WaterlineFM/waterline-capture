<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1F2D">
<title>Waterline</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="push/icon-192.png">
<link rel="apple-touch-icon" href="push/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800;900&family=Outfit:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Waterline Capture, the phone page (Work 015). Drawn to Design §21, the phone (DEC-0307), from render round 12
   (sandbox/mockups/phone-2026-10-20/round12.html). Every screen: one navy zone (21.1); teal on what can be
   pressed and nothing else (21.2); red and amber only where the desk's urgency function put them (21.3);
   cream page, white sheet, stone for what a row opens, navy for the zone (21.4); type in Design 6.3's roles at
   the 15px scale (21.5); one icon set, Lucide at 1.75 on a 24px grid (21.7); controls 44px or more (9.12);
   gaps from Design 4.6 (4 8 12 16 20 24 32 44 64). Inputs stay 16px, below which iOS zooms the page.
   Themes: the desk's THEMES (Design 5.2), Waterline, Light and Night, switched in Settings by anyone (DEC-0303 rule 4). */
body.t-wl{--cream:#F5F7F9;--white:#FFFFFF;--stone:#E4EEF4;--ink:#0D1F2D;--onInk:#FFFFFF;--navMid:rgba(255,255,255,.72);--onInkMid:rgba(255,255,255,.6);--inkTrack:rgba(255,255,255,.16);
  --text:#0D1F2D;--textMid:#3A5A72;--textMuted:#4A6E8C;--textMS:#4A6E8C;--border:#D4E3EC;--accent:#1E87A8;--accentD:#156B87;--accentOnInk:#3AABC6;--btnFill:#156B87;--btnText:#FFFFFF;--zBtnText:#071320;
  --red:#DC2626;--redText:#991B1B;--amber:#D97706;--amberText:#92400E;--inkRed:#F87171;--inkAmber:#FBBF24}
body.t-li{--cream:#F5F7F9;--white:#FFFFFF;--stone:#E4EEF4;--ink:#0D1F2D;--onInk:#FFFFFF;--navMid:rgba(255,255,255,.72);--onInkMid:rgba(255,255,255,.6);--inkTrack:rgba(255,255,255,.16);
  --text:#0D1F2D;--textMid:#3A5A72;--textMuted:#4A6E8C;--textMS:#4A6E8C;--border:#D4E3EC;--accent:#1E87A8;--accentD:#156B87;--accentOnInk:#3995B2;--btnFill:#156B87;--btnText:#FFFFFF;--zBtnText:#071320;
  --red:#DC2626;--redText:#991B1B;--amber:#D97706;--amberText:#92400E;--inkRed:#F87171;--inkAmber:#FBBF24}
/* Light on the phone (John, 21 Oct 2026, DEC-0310): the desk's Light differs from Waterline only in its sidebar, which the
   phone has not got, so on the phone Light turns the top block white with navy words. Its words, teal and state colours
   take the light-surface tokens; the block keeps its place, its one action and its hairline under it. */
body.t-li .zone{background:var(--white);border-bottom:1px solid var(--border);--onInk:#0D1F2D;--navMid:#3A5A72;--inkTrack:#E4EEF4;--accentOnInk:#156B87;--zBtnText:#FFFFFF;--inkRed:#991B1B;--inkAmber:#92400E}
body.t-li .zone .prog i,body.t-li .zone .fill,body.t-li .zone .steps span.d{background:var(--text)}
body.t-ni{--cream:#091624;--white:#0D2035;--stone:#122840;--ink:#071320;--onInk:#FFFFFF;--navMid:rgba(255,255,255,.72);--onInkMid:rgba(255,255,255,.6);--inkTrack:rgba(255,255,255,.16);
  --text:#C8E5F2;--textMid:#6A9BB5;--textMuted:#5490AB;--textMS:#6A9BB5;--border:#1C3A52;--accent:#3AABC6;--accentD:#7ECFE0;--accentOnInk:#5BBDD4;--btnFill:#3AABC6;--btnText:#071320;--zBtnText:#071320;
  --red:#F87171;--redText:#F87171;--amber:#FBBF24;--amberText:#FBBF24;--inkRed:#F87171;--inkAmber:#FBBF24}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;text-align:inherit}
/* Design 12.7: the focus ring is 2px solid accent, offset 2px, on every focusable element. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;min-height:100vh;min-height:100dvh}
.body{flex:1;padding-top:env(safe-area-inset-top)}
.n{font-family:Sora,sans-serif;font-variant-numeric:tabular-nums}
.mono{font:400 12px ui-monospace,'SFMono-Regular',Consolas,monospace;color:var(--textMid)}
svg{width:24px;height:24px;flex:none;display:block}
.hide{display:none!important}

/* the page title, on the page surface (Design 6.3, 4.13.1); nothing about the person (DEC-0302) */
.ttl{font:800 20px/1.3 Sora;padding:16px 16px}
.grp{font:700 11px Outfit;letter-spacing:2px;text-transform:uppercase;color:var(--textMuted);padding:24px 16px 8px}
/* the one navy zone (21.1) */
.zone{background:var(--ink);color:var(--onInk);padding:16px 16px 24px}
.eb{display:block;font:700 11px Outfit;letter-spacing:2px;text-transform:uppercase;color:var(--navMid)}
.ztop{display:flex;align-items:center;gap:8px;margin:-8px 0 8px -12px}
.zone .row1{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:4px}
.zone .num{font:900 72px/1 Sora;letter-spacing:-.04em}
.zone .what{font:800 20px/1.3 Sora;padding-bottom:8px}
.zone h1{font:800 20px/1.3 Sora;margin-top:4px;color:var(--onInk)}
.zone p{color:var(--navMid);margin-top:8px}
.zone p b{color:var(--onInk);font-weight:500}
.zone .mono{color:var(--navMid)}

/* buttons (Design 9.1, 5.11): one primary; ghosts carry a 1px teal edge */
.btn{min-height:48px;border-radius:8px;font:600 13px Outfit;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 16px;background:var(--btnFill);color:var(--btnText)}
.zone .btn{background:var(--accentOnInk);color:var(--zBtnText);margin-top:16px}
.btn[disabled]{background:var(--stone);color:var(--textMid);cursor:default}
.gh,.btn.g{min-height:48px;border-radius:8px;border:1px solid var(--accentD);color:var(--accentD);background:transparent;font:600 13px Outfit;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 16px}
.zone .gh{border-color:var(--accentOnInk);color:var(--accentOnInk);margin-top:12px}
.lnk{color:var(--accentD);font:600 13px Outfit;display:inline-flex;align-items:center;gap:4px;min-height:44px;text-decoration:underline;text-underline-offset:4px;flex:none}
.ib{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--accentD);flex:none;position:relative;border:2px solid transparent}
.ib.on{border-color:var(--accentD)}
.zone .ib{color:var(--accentOnInk)}
.ib.ov{background:var(--white);border-radius:22px;border:none}
.ib .bd{position:absolute;top:0;right:0;min-width:20px;height:20px;border-radius:10px;background:var(--accentD);color:var(--btnText);font:800 11px/20px Sora;text-align:center;padding:0 4px}
.pad{padding:12px 16px 0}
.row2{display:flex;gap:8px}
.row2>*{flex:1}

/* lists and rows: stripe, words, state; no icon tile, no chevron; the whole row is the target (21.2) */
.list{background:var(--white);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.r{position:relative;display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 16px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.r:last-child{border-bottom:none}
.r .s3{position:absolute;left:0;top:0;bottom:0;width:3px}
.r .m{flex:1;min-width:0}
.r .w{display:block;font-weight:500;line-height:1.4}
.sub{display:block;font-size:12px;line-height:1.4;color:var(--textMuted);margin-top:4px}
.r .st{flex:none;text-align:right;max-width:128px}
.r .st b{display:block;font:800 15px Sora}
.r .st i{display:block;font:400 12px 'DM Sans';font-style:normal}
/* a category opened the desk's way (DEC-0140): one stone band; each line's own tier dashed down its edge (DEC-0252) */
.cat .w{font:700 15px/1.4 Sora}
.cat.open{background:var(--stone);border-bottom:none}
.inner{background:var(--stone);border-bottom:1px solid var(--border)}
.inner .r{border-bottom:none;border-top:1px solid var(--border);align-items:flex-start}
.inner .sub,.cat.open .sub,.no .sub{color:var(--textMS)}
.badge{display:inline-block;font:700 11px/20px Outfit;padding:0 8px;border-radius:4px;border:1px solid var(--border);color:var(--textMid);background:var(--white)}
.wait{padding:12px 16px;background:var(--white);border-bottom:1px solid var(--border);color:var(--textMid);line-height:1.6}
.wait b{color:var(--text);font-weight:500}
.para{color:var(--textMid);padding:16px}
.note{margin:12px 16px 0;padding:12px;background:var(--white);border:1px solid var(--border);border-radius:8px;color:var(--textMid)}
.note .eb{color:var(--textMuted);margin-bottom:4px}
.note b{color:var(--text);font-weight:500}
.f{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:12px 16px;border-bottom:1px solid var(--border);line-height:1.4}
.f:last-child{border-bottom:none}
.f .k{width:96px;flex:none;font:600 12px/20px Outfit;color:var(--textMid)}
.f .v{flex:1;min-width:0}
.f .lnk{margin:-12px 0}

/* the bar: Due · Jobs · Capture · Settings. Every tab is pressable, so teal; the chosen one underlined (21.2).
   Capture is the main button in the middle (DEC-0301, DEC-0303 rule 2); the bar paints over the page. */
.navb{position:sticky;bottom:0;z-index:5;display:flex;align-items:flex-start;height:calc(80px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--white);border-top:1px solid var(--border)}
.navb .side{flex:1;display:flex}
.nv{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 11px Outfit;letter-spacing:1.5px;text-transform:uppercase;color:var(--accentD)}
.nv.on span{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.nv.cap{flex:none;width:88px;height:80px;justify-content:flex-start;margin-top:-24px}
.nv.cap .capb{width:56px;height:56px;border-radius:50%;background:var(--btnFill);color:var(--btnText);display:grid;place-items:center;box-shadow:0 0 0 4px var(--white)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(13,31,45,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;background:var(--white);border-radius:12px 12px 0 0;max-height:88vh;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 4px 16px}
.sh b{font:800 20px Sora}
.sheet .grp{padding-top:8px}
.opts{background:var(--white);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.sheet .opts{border-top:none}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 16px;border-bottom:1px solid var(--border);width:100%;text-align:left;line-height:1.4}
.opt:last-child{border-bottom:none}
.opt .m{flex:1;min-width:0}
.opt .rt{font-size:12px;color:var(--textMuted);flex:none}
.rad{width:24px;height:24px;border-radius:50%;border:2px solid var(--accentD);flex:none}
.opt.on .rad{box-shadow:inset 0 0 0 4px var(--white),inset 0 0 0 12px var(--accentD)}
.ck{width:24px;height:24px;border-radius:4px;border:2px solid var(--accentD);flex:none;position:relative;color:var(--btnText)}
.opt.on .ck{background:var(--accentD)}
.ck svg{position:absolute;left:-2px;top:-2px}
.sfoot{display:flex;gap:8px;padding:16px 16px 24px;position:sticky;bottom:0;background:var(--white);border-top:1px solid var(--border)}
.verb{display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 16px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.verb:last-child{border-bottom:none}
.verb svg{color:var(--accentD)}
.verb .w{display:block;font-weight:500}
.verb .sub{margin-top:0}
.verb[disabled]{cursor:default}
.verb[disabled] svg{color:var(--textMuted)}
.verb[disabled] .w{color:var(--textMid)}

/* forms */
.field{padding:16px 16px 0}
.field>label,.field>.fl{display:block;font:600 12px Outfit;color:var(--text);margin-bottom:8px}
.field .opt-w{color:var(--textMuted)}
textarea,input[type=text],input[type=url],input[type=search],select{width:100%;background:var(--white);border:1.5px solid var(--accentD);border-radius:8px;padding:12px;font-size:16px;line-height:1.4;min-height:48px;color:var(--text)}
textarea{min-height:96px;resize:vertical}
::placeholder{color:var(--textMuted);opacity:1}
.help{font-size:12px;line-height:1.4;color:var(--textMuted);margin-top:8px}
.help.err{color:var(--text)}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0}
.inrow .gh{width:auto;flex:none}
.sugg{margin-top:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.chosen{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:4px 4px 4px 12px;min-height:48px;line-height:1.4}
.chosen .m{flex:1;min-width:0}
.keep{display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer;line-height:1.4}
.keep input{width:24px;height:24px;flex:none;accent-color:var(--accentD)}
.foot{position:sticky;bottom:0;z-index:4;background:var(--white);border-top:1px solid var(--border);padding:12px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.foot .sub{margin-top:0}
.foot .note{margin:0}
.seg{display:flex;gap:8px;padding:0 16px}
.seg.col{flex-direction:column;padding:0}
.seg button{flex:1;min-height:48px;border-radius:8px;border:1px solid var(--accentD);color:var(--accentD);font:600 13px Outfit;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 12px}
.seg.col button{justify-content:flex-start}
.seg button.on{border-width:2px}
/* photos */
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{width:88px;height:88px;border-radius:8px;background:var(--stone) center/cover no-repeat;position:relative;display:grid;place-items:center;font:700 11px Outfit;color:var(--textMid)}
.th .x{position:absolute;top:-8px;right:-8px;width:44px;height:44px;display:grid;place-items:center;color:var(--accentD)}
.th .x i{display:grid;place-items:center;width:32px;height:32px;border-radius:16px;background:var(--white);border:1px solid var(--accentD)}
.th.add{background:var(--white);border:1px solid var(--accentD);color:var(--accentD);cursor:pointer}
.th.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* a reading: the figure at stat size (Design 6.2) */
.fig{display:flex;align-items:baseline;gap:8px;border:1.5px solid var(--accentD);border-radius:8px;background:var(--white);padding:8px 12px;min-height:80px}
.fig input{font:800 48px/1 Sora;letter-spacing:-.04em;font-variant-numeric:tabular-nums;border:none;background:none;width:100%;min-width:0;padding:0;min-height:64px;color:var(--text)}
.fig input:focus{outline:none}
.fig:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.fig .u{font-size:15px;color:var(--textMid);flex:none}
.field>label.fig{display:flex;font:400 15px/1.6 'DM Sans',sans-serif;color:var(--text);margin-bottom:0}
/* yes / no (DEC-0294): chosen is a heavier teal edge and a check, never a fill */
.q{padding:12px 16px 16px;border-bottom:1px solid var(--border)}
.q:last-child{border-bottom:none}
.q .w{font-weight:500;line-height:1.4}
.yn{display:flex;gap:8px;margin-top:8px}
.yn button{flex:1;min-height:56px;border-radius:8px;border:1px solid var(--accentD);color:var(--accentD);font:600 13px Outfit;display:flex;align-items:center;justify-content:center;gap:4px}
.yn button.on{border-width:2px}
.unans{font-size:12px;color:var(--text);margin-top:8px}
.no{margin-top:12px;padding:12px;background:var(--stone);border-radius:8px}
.no .sub{margin-top:0}
.no input{margin-top:8px}
.no .thumbs{margin-top:8px}
/* the walk: the next point leads, what is left follows (audit F1) */
.prog{height:4px;border-radius:2px;background:var(--inkTrack);margin-top:16px;overflow:hidden}
.prog i{display:block;height:4px;background:var(--onInk)}
.steps{display:flex;gap:4px;margin-top:16px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--inkTrack)}
.steps span.d{background:var(--onInk)}
.stepl{display:flex;justify-content:space-between;margin-top:8px;font:700 11px Outfit;letter-spacing:1.5px;text-transform:uppercase;color:var(--navMid)}
.stepl b{color:var(--onInk);font-weight:700}
/* jobs: the photo leads (DEC-0305); with none, the job's own words in its place */
.pic{display:grid;place-items:center;text-align:center;flex:none;border-radius:8px;overflow:hidden;padding:8px;background:var(--stone);color:var(--text);font:400 12px/1.4 'DM Sans';align-content:center;gap:4px}
.pic i{font:700 11px Outfit;font-style:normal;color:var(--textMS)}
.pic.sm{width:88px;height:88px}
.pic.wide{width:100%;aspect-ratio:4/3;border-radius:0}
.hp{position:relative}
.hp .pic.wide{aspect-ratio:auto;height:160px;font:800 20px/1.3 Sora;padding:24px 64px}
.hp .ov{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top))}
.ra{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:flex-start;width:100%;text-align:left}
.ra:last-child{border-bottom:none}
.ra .m{flex:1;min-width:0}
.ra .w,.cb .w{display:block;font-weight:500;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.cb{background:var(--white);border:1px solid var(--border);border-radius:8px;overflow:hidden;text-align:left;display:block}
.cbt{padding:8px 12px 12px}
.sw{display:flex;margin:16px -16px -24px;border-top:1px solid var(--inkTrack)}
.sw button{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 13px Outfit;color:var(--accentOnInk);border-bottom:4px solid transparent}
.sw button.on{border-bottom-color:var(--accentOnInk)}
.sw .n{font:800 15px Sora}
.tools{display:flex;align-items:center;gap:4px;padding:12px 16px}
.search{flex:1;min-width:0;height:48px;border:1.5px solid var(--accentD);border-radius:8px;background:var(--white);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--accentD)}
.search input{border:none;background:none;padding:0;min-height:44px;min-width:0;flex:1}
.search input:focus{outline:none}
.search:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.act{display:flex;gap:8px;align-items:center;padding:0 16px 8px;font-size:12px;color:var(--textMuted)}
.act .lnk{margin-left:auto}
/* start-up (DEC-0301): the site's tile large, the Waterline mark, the progress naming each step */
.splash{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--cream)}
.splash .mid{flex:1;display:grid;place-items:center;padding-top:env(safe-area-inset-top)}
.tile{width:200px;height:200px;border-radius:12px;background:#FFFFFF;display:grid;place-items:center;border:1px solid var(--border)}
.tile img{width:176px;height:176px;object-fit:contain}
.wm{display:flex;justify-content:center;padding-bottom:32px}
.brand{width:200px;max-width:60vw;height:auto;display:block}
body.t-ni .brand{background:#FFFFFF;border-radius:8px;padding:8px}
.splash .zone{padding-bottom:calc(44px + env(safe-area-inset-bottom))}
.track{height:4px;border-radius:2px;background:var(--inkTrack);margin-top:16px;overflow:hidden}
.fill{height:4px;background:var(--onInk);border-radius:2px;transition:width .3s cubic-bezier(0.16,1,0.3,1)}
.zone p.step{color:var(--onInk)}
@media (prefers-reduced-motion: reduce){ .fill{transition:opacity .44s} }
.zone.logo{display:flex;justify-content:center;padding:24px 16px}

/* a cream top for the tag list inside the scanner */
.top{display:flex;align-items:center;gap:4px;padding:calc(4px + env(safe-area-inset-top)) 8px 4px;background:var(--cream);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--border)}
.top .t{flex:1;font:800 20px Sora;text-align:center}
.ibtn{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--accentD);flex:none}
/* scanner: the camera's own dark surface */
.scan{position:fixed;inset:0;background:var(--ink);color:var(--onInk);z-index:20;display:flex;flex-direction:column}
.scan>.top{background:var(--ink);border-bottom-color:var(--ink)}
.scan>.top .t{color:var(--onInk)}

<script>
'use strict';
// ── Where captures go ────────────────────────────────────────────────────────────────────────
// One interface, two backings (Work 015 plan, D2a). add(path, blob) never overwrites: it fails with
// code 'exists' if the file is already there (DEC-0265 rule 2). read(path) gives text, or null when
// the file is not there. Nothing on this page deletes, renames or edits a file.
// The real backing is the site's Google relay (DEC-0279, companion/relay.gs): a set-up link from the
// desk carries its address and the site code, kept on this phone. Staff sign in to nothing.
// The sandbox check hands the page an in-memory folder instead.
function testStore(){ try{ return window.parent!==window&&window.parent.wfmTestStore||null; }catch(e){ return null; } }
function b64(blob){ return new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]||''); r.onerror=()=>no(r.error); r.readAsDataURL(blob); }); }
// A set-up link is ?relay=<address>&code=<site code>. It is kept, then taken out of the address bar.
function takeSetupLink(href){
  try{ const q=new URL(href,location.href).searchParams, relay=q.get('relay'), code=q.get('code');
    if(!relay||!code||!/^https:\/\/script\.google\.com\//.test(relay)&&!/^http:\/\/localhost[:\/]/.test(relay)) return false;
    localStorage.setItem('wl_relay',JSON.stringify({url:relay,code:code})); return true; }catch(e){ return false; }
}
function relayStore(){
  if(takeSetupLink(location.href)) history.replaceState(null,'',location.pathname);
  let r=null; try{ r=JSON.parse(localStorage.getItem('wl_relay')||'null'); }catch(e){}
  if(!r||!r.url||!r.code) return null;
  const call=async body=>{
    // text/plain keeps it a simple request, so the browser sends it without a preflight.
    const res=await fetch(r.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({code:r.code},body))});
    let j=null; try{ j=await res.json(); }catch(e){ throw new Error('The site’s relay did not answer properly ('+res.status+')'); }
    if(!j.ok){ const e=new Error(j.why||'The site’s relay refused it'); e.code=j.code; throw e; }
    return j;
  };
  return {
    account:async()=>null,
    add:async(path,blob)=>{ await call({op:'add',path:path,type:blob.type||'',data:await b64(blob)}); },
    // A read gives up after 20 seconds, so a relay that does not answer never holds the page on "Reading the site
    // details": it opens on the copy kept on this phone and says the desk could not be reached (DEC-0287 rule 3).
    read:async path=>{ let t;
      try{ return (await Promise.race([call({op:'read',path:path}),new Promise((_,no)=>{ t=setTimeout(()=>{ const e=new Error('The site’s relay did not answer in 20 seconds'); e.code='timeout'; no(e); },20000); })])).text; }
      catch(e){ if(e.code==='missing') return null; throw e; }
      finally{ clearTimeout(t); } }
  };
}
const STORE=testStore()||relayStore();

// ── Small helpers ────────────────────────────────────────────────────────────────────────────
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>(n<10?'0':'')+n;
// Design 8.8: DD MMM YYYY and the 24-hour clock.
const day=d=>{d=new Date(d);return pad(d.getDate())+' '+MON[d.getMonth()]+' '+d.getFullYear();};   // DD MMM YYYY (Design 8.8)
const hm=d=>{d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes());};
const when=d=>{const x=new Date(d),t=new Date();return (x.toDateString()===t.toDateString()?'today':day(x))+' at '+hm(x);};
function ago(ms){
  const m=Math.round(ms/6e4);
  if(m<2) return 'just now';
  if(m<60) return m+' minutes ago';
  const h=Math.round(m/60); if(h<48) return h+(h===1?' hour ago':' hours ago');
  return Math.round(h/24)+' days ago';
}
const plural=(n,a,b)=>n+' '+(n===1?a:(b||a+'s'));
function newId(){
  const d=new Date(), r=Math.random().toString(36).slice(2,6).toUpperCase().padEnd(4,'0');
  return 'CAP-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+'-'+r;
}
function device(){
  const u=navigator.userAgent||'';
  const what=/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android phone':'Computer';
  const br=/EdgA?\//.test(u)?'Edge':/CriOS|Chrome\//.test(u)?'Chrome':/FxiOS|Firefox\//.test(u)?'Firefox':/Safari\//.test(u)?'Safari':'a browser';
  return what+', '+br;
}
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
          del(k){try{localStorage.removeItem(k);}catch(e){}}};
const ss={get(k){try{return sessionStorage.getItem(k)||'';}catch(e){return '';}},
          set(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}};

const ICO=(n,cls)=>'<svg'+(cls?' class="'+cls+'"':'')+' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+LUCIDE[n]+'</svg>';
const I={close:ICO('x'),back:ICO('chevron-left'),chev:ICO('chevron-right','chev'),fault:ICO('triangle-alert'),cert:ICO('file-check'),meter:ICO('gauge'),reading:ICO('thermometer'),photo:ICO('camera'),round:ICO('route'),scan:ICO('scan-line'),plus:ICO('plus'),tick:ICO('check'),wait:ICO('clock'),due:ICO('calendar-check'),me:ICO('user'),gear:ICO('settings'),jobs:ICO('wrench'),search:ICO('search'),list:ICO('list'),grid:ICO('layout-grid'),sliders:ICO('sliders-horizontal'),send:ICO('send'),clip:ICO('paperclip'),link:ICO('link'),flag:ICO('flag'),unflag:ICO('flag-off'),play:ICO('play'),pause:ICO('pause')};

// ── State ────────────────────────────────────────────────────────────────────────────────────
// Only what this phone needs. Records live in the desk app; this page keeps the site details it
// last read, the captures it has not managed to send, and a short list of what it sent.
const st={screen:'start',site:null,siteAt:0,siteErr:'',account:null,walker:'',pos:'',pid:'',form:null,scanFor:null,outbox:[],busy:false,sheet:false};

// ── The site file (DEC-0271) ─────────────────────────────────────────────────────────────────
// Read, never written. A copy is kept on the phone so it still knows the site when it has no
// signal, and its age is always said (DEC-0271 rule 4).
async function loadSite(){
  const path=WFM_SITE_SHAPE.folder+'/'+WFM_SITE_SHAPE.file;
  let text=null;
  try{ text=await STORE.read(path); st.siteErr=text==null?'missing':''; }
  catch(e){ st.siteErr=e&&e.code==='refused'?'refused':'unreachable'; }
  if(text!=null){
    try{
      const o=JSON.parse(text);
      if(!o||o.format!==WFM_SITE_SHAPE.format) st.siteErr='notsite';
      else if(Number(o.version)>WFM_SITE_SHAPE.version) st.siteErr='newer';
      else { st.site=o; ls.set('wl_site',o); st.siteErr=''; }
    }catch(e){ st.siteErr='broken'; }
  }
  if(!st.site){ const kept=ls.get('wl_site',null); if(kept&&kept.format===WFM_SITE_SHAPE.format) st.site=kept; }
}
const siteAge=()=>st.site&&st.site.published?Date.now()-Date.parse(st.site.published):Infinity;
const siteStale=()=>!(siteAge()<WFM_SITE_SHAPE.freshHours*36e5);
const points=()=>(st.site&&st.site.points)||[];
const pointById=id=>points().find(p=>p.id===id)||null;
// Every meter a phone can read, from the desk, tagged or not (DEC-0283). A picked meter is shown as a
// point with no tag, so the reading screen is the same one.
const meters=()=>(st.site&&st.site.meters)||[];
const meterAsPoint=id=>{ const m=meters().find(x=>x.id===id); return m?{id:'',name:m.name,where:m.where,rec:{reg:'meterItems',id:m.id,ref:m.id},reading:m.reading,picked:true}:null; };
const lineById=id=>((st.site&&st.site.lines)||[]).find(l=>l.id===id)||null;
const roundById=id=>((st.site&&st.site.rounds)||[]).find(r=>r.id===id)||null;
function pointLabel(p){ return p?(p.name+(p.where?' — '+p.where:'')):''; }

// The site file's line about itself: how old it is, or why there is none.
function siteNote(){
  const pub=st.site&&st.site.published;
  const why={missing:'The desk has not published the site details yet.',unreachable:'The site details could not be reached just now.',refused:'This phone’s site code is not this site’s. Open the latest set-up link from the desk.',
    notsite:'The file in Phone/ is not a site details file.',newer:'The desk published a newer kind of site details than this page reads. Reload the page.',
    broken:'The site details file could not be read. It may still be arriving.'}[st.siteErr]||'';
  if(!st.site) return '<div class="note amber"><span class="eb">No site details</span>'+esc(why)+' You can still report a fault or send a photo in your own words. Lines, outlet ranges and past faults show once the desk publishes them.</div>';
  const age='Published by the desk '+(pub?'<span class="n">'+day(pub)+' at '+hm(pub)+'</span>, '+ago(siteAge()):'at a time it did not say')+'.';
  if(siteStale()) return '<div class="note amber"><span class="eb">Site details out of date</span>'+age+(why?' '+esc(why):'')+' Lines, ranges and past faults may have changed since. The desk republishes every time it reads the Inbox.</div>';
  return '<div class="note"><span class="eb">Site details</span>'+age+(why?' '+esc(why)+' This is the copy kept on this phone.':'')+'</div>';
}

// ── The outbox: captures kept on the phone until they are sent ────────────────────────────────
// IndexedDB, because photos are too big for localStorage. A capture is written here before any
// upload starts, and removed only when its record has landed.
let _db=null, _dbHeld=0;
function db(){
  if(_db) return _db;
  if(Date.now()-_dbHeld<60000) return Promise.reject(new Error('The phone’s store is held by another copy of this page.'));
  // Version 2 adds the photos store: small copies of open jobs' photos, kept once read (DEC-0305, DEC-0308 rule 4).
  _db=new Promise((ok,no)=>{ const r=indexedDB.open('waterline-capture',2);
    r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox',{keyPath:'id'}); if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos'); };
    // Another copy of this page open on the phone can hold the store while it upgrades. Give up after 5 s and try
    // again next time rather than wait for ever; and let a newer copy take the store from this one.
    const t=setTimeout(()=>{ _db=null; _dbHeld=Date.now(); no(new Error('The phone’s store is held by another copy of this page.')); },5000);
    r.addEventListener('success',()=>{ clearTimeout(t); r.result.onversionchange=()=>{ r.result.close(); _db=null; }; });
    r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); });
  return _db;
}
async function obAll(){ const d=await db(); return new Promise((ok,no)=>{ const q=d.transaction('outbox').objectStore('outbox').getAll(); q.onsuccess=()=>ok(q.result||[]); q.onerror=()=>no(q.error); }); }
async function obPut(c){ const d=await db(); return new Promise((ok,no)=>{ const t=d.transaction('outbox','readwrite'); t.objectStore('outbox').put(c); t.oncomplete=ok; t.onerror=()=>no(t.error); }); }
async function phGet(n){ const d=await db(); return new Promise(ok=>{ const q=d.transaction('photos').objectStore('photos').get(n); q.onsuccess=()=>ok(q.result||null); q.onerror=()=>ok(null); }); }
async function phPut(n,v){ const d=await db(); return new Promise(ok=>{ const t=d.transaction('photos','readwrite'); t.objectStore('photos').put(v,n); t.oncomplete=ok; t.onerror=()=>ok(); }); }
// Photos of jobs no longer in the site file go from the phone.
async function phPrune(){ if(!st.site) return; const keep=new Set();
  (SITE().jobs||[]).forEach(j=>{ (j.photos||[]).forEach(n=>keep.add(n)); (j.thread||[]).forEach(e=>(e.photos||[]).forEach(n=>keep.add(n))); });
  const d=await db(), s=d.transaction('photos','readwrite').objectStore('photos'), q=s.getAllKeys();
  q.onsuccess=()=>(q.result||[]).forEach(k=>{ if(!keep.has(k)) s.delete(k); }); }

// Files first, the record last, so the desk lists a capture only once everything is there (slice A).
// A file already there was sent on an earlier try: ids are new for every capture.
async function deliver(c){
  const put=async(path,blob)=>{ try{ await STORE.add(path,blob); }catch(e){ if(!(e&&e.code==='exists')) throw e; } };
  for(const f of c.files){
    if(c.done.indexOf(f.name)>=0) continue;
    await put('Inbox/'+f.name,f.blob);
    c.done.push(f.name); await keep(c);
  }
  await put('Inbox/'+c.id+'.json',new Blob([JSON.stringify(c.record,null,1)],{type:'application/json'}));
}
// Kept in the outbox; if the phone's store is held by another copy of the page, sent straight away all the same.
const keep=c=>obPut(c).catch(e=>console.warn('outbox',e));
async function send(c){
  await keep(c);

  catch(e){ console.warn('send',e); c.err=String(e&&e.message||e); c.errCode=e&&e.code||''; await keep(c); return false; }
  await obDel(c.id).catch(()=>{}); return true;
}
async function sendKept(){

function summary(r){
  if(r.kind==='round'){ const rd=roundById(r.round); return (rd?rd.name:'Round')+', '+plural((r.scans||[]).length,'point')+' scanned'; }
  if(r.kind==='reading'){ const p=r.point?pointById(r.point):(r.record?meterAsPoint(r.record.id):null); return 'Reading at '+(p?p.name:r.place||'a tag'); }
  if(r.kind==='certificate'){ const l=lineById(r.duty); return kindLabel('certificate')+(l?' for '+l.what:''); }
  const p=r.point?pointById(r.point):null;

async function shrink(file){
  // Camera photos run to several megabytes; a long edge of 2400px keeps a certificate readable on the
  // desk and the upload small on mobile data. Anything that is not a photo is sent as it is.
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try{
    const bm=await createImageBitmap(file), k=Math.min(1,2400/Math.max(bm.width,bm.height));
    if(k===1&&file.size<1.5e6) return file;
    const cv=document.createElement('canvas'); cv.width=Math.round(bm.width*k); cv.height=Math.round(bm.height*k);
    cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
    return await new Promise(ok=>cv.toBlob(b=>ok(b||file),'image/jpeg',.85));
  }catch(e){ return file; }
}
function extOf(blob,name){
  const t=blob.type||'';
  if(t==='image/jpeg') return 'jpg'; if(t==='image/png') return 'png'; if(t==='image/webp') return 'webp';
  if(t==='application/pdf') return 'pdf'; if(t==='image/heic') return 'heic';
  const m=/\.([a-z0-9]{2,5})$/i.exec(name||''); return m?m[1].toLowerCase():'bin';
}
async function makeCapture(kind,fields,photos){
  const id=newId(), files=[];
  for(let i=0;i<photos.length;i++){
    const b=await shrink(photos[i].file), name=id+'-'+(i+1)+'.'+extOf(b,photos[i].file.name);
    files.push({name:name,blob:b,type:b.type||'application/octet-stream'});
  }
  const rec={format:WFM_CAPTURE_SHAPE.format,version:WFM_CAPTURE_SHAPE.version,id:id,kind:kind,
    taken:fields.taken||new Date().toISOString(),person:st.walker,account:st.account?st.account.username:'',device:device()};
  // The fields the shape names, read from it (Principles, Law 3): a field added on the desk travels without a list here.
  WFM_CAPTURE_SHAPE.fields.filter(k=>!(k in rec)&&k!=='files').forEach(k=>{ const v=fields[k]; if(v!=null&&v!==''&&!(Array.isArray(v)&&!v.length)) rec[k]=v; });
  rec.files=files.map(f=>({name:f.name,type:f.type,bytes:f.blob.size}));
  // Every field written is one the shape names: the desk is the judge of the contract.
  Object.keys(rec).forEach(k=>{ if(WFM_CAPTURE_SHAPE.fields.indexOf(k)<0) throw new Error('Not in the capture shape: '+k); });
  return {id:id,record:rec,files:files,done:[],made:Date.now()};
}

// Read from what the desk published; the phone judges nothing. Walks by their walker, lines by the

// line naming no one or a duty nobody holds.

    (r.times||[]).forEach(t=>{ const a=timeToday(t); if(a>now){ const n=nextTime(r,t); let b=timeToday(n); if(b<=a) b+=864e5; today.push({t:'walk',r:r,from:a,to:b}); } });
  });

    const ds=i.duties||[];

  today.sort((a,b)=>(a.t==='walk'?a.from:0)-(b.t==='walk'?b.from:0));
  soon.sort((a,b)=>String(a.i.due).localeCompare(String(b.i.due)));

// ── Due, the landing place ───────────────────────────────────────────────────────────────────
// ── Due, the landing place ──
// The FM's hero is the site's overdue line, as on the desk (DEC-0286 rule 1). Everyone else's is the next thing to do
// (DEC-0303 rule 5): the walk open now, or the next one, or their overdue count when neither. Lines sit in their
// categories, each with its count, opening in place the desk's way (DEC-0303 rule 6; DEC-0140).
function vDue(){
  st.place='due';
  let h='<div class="body"><h1 class="ttl">Due</h1>';
  if(!st.site) return h+'<div class="zone"><span class="eb">Nothing from the desk yet</span><p>Due shows once the desk has published the site details. You can still capture from the button below.</p></div>'+waitLine()+siteNote()+'<div style="height:96px"></div></div>'+navBar('due');
  const D=dueFor(), s=SITE(), H=s.health||{};
  const nowW=D.fm?null:D.today.find(x=>x.t==='walk'&&x.now&&!sentIn(x.r.id,x.from,x.to)), nextW=D.fm||nowW?null:D.today.find(x=>x.t==='walk'&&!x.now);
  const lead=nowW||nextW;
  if(D.fm){
    const wk=(s.due||[]).filter(i=>i.round&&i.kind==='overdue').length, ln=(H.overdue||0)-wk;
    h+='<div class="zone"><span class="eb">On the site</span><div class="row1"><span class="num n" style="color:'+(H.overdue?'var(--inkRed)':'var(--onInk)')+'"'+(H.overdue?' data-urg':'')+'>'+(H.overdue||0)+'</span><span class="what">overdue</span></div>'
      +'<p><b class="n">'+wk+'</b> '+(wk===1?'walk has':'walks have')+' times not walked and <b class="n">'+ln+'</b> '+(ln===1?'line is':'lines are')+' past due, against <b class="n">'+(H.inDate||0)+'</b> in date.</p></div>';
  } else if(lead){
    const r=lead.r;
    h+='<div class="zone"><span class="eb">'+(nowW?'Open now':'Next')+'</span><div class="row1"><span class="num n">'+esc(hm(lead.from))+'</span><span class="what">'+esc(r.name)+'</span></div>'
      +'<p><b class="n">'+(r.points||[]).length+'</b> points, '+(nowW?'open until':'open from <b class="n">'+esc(hm(lead.from))+'</b> to')+' <b class="n">'+esc(hm(lead.to))+'</b>.'+((r.lines||[]).length?' Signed off, it brings <b class="n">'+r.lines.length+'</b> '+((r.lines.length===1)?'line':'lines')+' in date.':'')+'</p>'
      +(nowW?'<button class="btn" data-act="walkStart" data-id="'+esc(r.id+'|'+lead.from)+'">'+I.scan+'Start the Walk</button>':'')+'</div>';
  } else {
    const n=D.over.length, all=n+D.today.length+D.soon.length;
    h+='<div class="zone"><span class="eb">For you</span><div class="row1"><span class="num n" style="color:'+(n?'var(--inkRed)':'var(--onInk)')+'"'+(n?' data-urg':'')+'>'+n+'</span><span class="what">overdue</span></div>'
      +'<p>'+(all?'Of <b class="n">'+all+'</b> on your Due.':'Nothing on your Due.')+'</p></div>';
  }
  h+=waitLine();
  if(siteStale()||st.siteErr) h+=siteNote();
  const today=D.today.filter(x=>x!==lead);
  const any=D.over.length+today.length+D.soon.length;
  if(!any){
    const p=D.p;
    h+='<p class="para">'+(p?'Nothing else is due for '+esc(p.title)+' today or in the next '+(s.outlook||7)+' days. ':'')+'Due comes from the walks your department does, the lines your position’s duties cover and the jobs in its groups, all set on the desk’s Organisation Structure.</p>';
    return h+'<div style="height:96px"></div></div>'+navBar('due');
  }
  const firstOver=D.over.filter(x=>x.t!=='line'), lines=D.over.filter(x=>x.t==='line'&&x.i.kind!=='look'), look=D.over.filter(x=>x.t==='line'&&x.i.kind==='look');
  if(firstOver.length) h+=grp('Overdue')+'<div class="list">'+firstOver.map(dueRow).join('')+'</div>';
  if(lines.length) h+=grp('Lines, by category')+'<div class="list">'+cats(lines)+'</div>';
  if(look.length) h+=grp('To look at')+'<div class="list">'+look.map(dueRow).join('')+'</div>';
  if(today.length) h+=grp('Today')+'<div class="list">'+today.map(dueRow).join('')+'</div>';
  if(D.soon.length) h+=grp('Next '+(s.outlook||7)+' days')+'<div class="list">'+D.soon.map(dueRow).join('')+'</div>';
  else h+='<p class="para">Nothing else falls due in the next '+(s.outlook||7)+' days.</p>';
  return h+'<div style="height:96px"></div></div>'+navBar('due');
}
// Lines in their categories: one row each with its count and its oldest, red count first (DEC-0252 rule 3, DEC-0254
// words); the open one is a stone band with each line's own tier dashed down its edge (DEC-0140). Evidence state and
// last checked are not in the site file yet (the desk's next slice), so a line row does not claim either.
function cats(xs){
  const by={}, rk={red:0,amber:1,grey:2}; xs.forEach(x=>{ const c=secOf(x.i); (by[c]=by[c]||[]).push(x.i); });
  const order=Object.keys(by).sort((a,b)=>Math.min(...by[a].map(i=>rk[i.tier]||2))-Math.min(...by[b].map(i=>rk[i.tier]||2))||by[b].length-by[a].length);
  return order.map(c=>{ const L=by[c].sort((a,b)=>(rk[a.tier]||2)-(rk[b.tier]||2)||(b.late||0)-(a.late||0)), n={red:0,amber:0,grey:0}; L.forEach(i=>n[i.tier in n?i.tier:'grey']++);
    const lead=n.red?'red':n.amber?'amber':'grey', T=TIER[lead], word={red:'urgent',amber:'need action',grey:'to watch'}[lead], open=st.openCat===c, old=overDays(Math.max(...L.map(i=>i.late||0)));
    let h='<button class="r cat'+(open?' open':'')+'" data-act="openCat" data-id="'+esc(c)+'" aria-expanded="'+open+'"><span class="s3" style="background:'+T[0]+'"'+(lead!=='grey'?' data-urg':'')+'></span><span class="m"><span class="w">'+esc(c)+'</span><span class="sub">'+esc(plural(L.length,'line'))+' · oldest '+esc(old.join(' '))+'</span></span>'
      +'<span class="st"'+(lead!=='grey'?' data-urg':'')+'><b class="n" style="color:'+T[1]+'">'+n[lead]+'</b><i style="color:'+T[1]+'">'+word+'</i></span></button>';
    if(open) h+='<div class="inner">'+L.map(i=>{ const t=TIER[i.tier]||TIER.grey, a=overDays(i.late||0), u=i.tier==='red'||i.tier==='amber'?' data-urg':'';
      const tag=i.nobody?' <span class="badge">Nobody holds this duty</span>':(!(i.duties||[]).length?' <span class="badge">Names no one</span>':'');
      return '<button class="r" data-act="openLine" data-id="'+esc(i.id)+'"><span class="s3" style="background:repeating-linear-gradient(to bottom,'+t[0]+' 0 8px,transparent 8px 12px)"'+u+'></span><span class="m"><span class="w">'+esc(i.what)+'</span><span class="sub"><span class="mono">'+esc(i.id)+'</span>'+tag+'</span></span>'
        +'<span class="st"'+u+'><b class="n" style="color:'+t[1]+'">'+esc(a[0])+'</b><i style="color:'+t[1]+'">'+esc(a[1])+'</i></span></button>'; }).join('')+'</div>';
    return h; }).join('');
}

st.J={state:'todo',view:'list',sort:'new',groups:[],q:''};

function jobsAll(){ const p=myPos(), fm=isFM(p), gs=new Set(p?(p.groups||[]):[]); return (SITE().jobs||[]).filter(j=>!j.round&&!j.planned&&(fm||gs.has(j.group))); }

// Small copies of a job's photos, base64 JPEG text the desk writes to Phone/photos/ (DEC-0305, DEC-0308 rule 4), read
// through the relay when a job is shown and kept on this phone.
const _ph={};
async function phLoad(names){
  const want=[...new Set(names)].filter(n=>n&&!_ph[n]); if(!want.length) return;
  want.forEach(n=>{ _ph[n]='loading'; });
  let got=0;
  for(const n of want){
    let t=await phGet(n).catch(()=>null), gone=false;
    if(!t){ try{ t=await STORE.read(WFM_SITE_SHAPE.folder+'/'+WFM_SITE_SHAPE.photos.folder+'/'+n); gone=t==null; if(t) phPut(n,t).catch(()=>{}); }
      catch(e){ gone=e&&(e.code==='bad'||e.code==='refused'); } }
    t=t?String(t).trim():'';
    if(t){ _ph[n]=t.indexOf('data:')===0?t:'data:'+WFM_SITE_SHAPE.photos.type+';base64,'+t; got++; }
    else if(gone){ _ph[n]='missing'; got++; }
    else delete _ph[n];   // no signal: tried again on the next screen
  }
  if(got&&(st.screen==='job'||st.screen==='jobs')) keepRender();
}
function phImg(n,cls,alt,j){ const s=_ph[n];
  if(s&&s!=='loading'&&s!=='missing') return '<img class="'+cls+'" src="'+s+'" alt="'+esc(alt||'Photo')+'">';
  if(s==='missing'&&j) return words(j,cls);
  return '<span class="pic '+cls+'"><i>'+(s==='missing'?'Photo not on this phone':'Photo loading')+'</i></span>'; }

// Sends one job update and stays on the job. Kept in wl_jobSent so the thread shows it as sent until it is filed.
async function jobSend(act){

  if(act==='done'){ fields.note=String(F.dnote||'').trim(); photos=F.dphotos||[]; }
  if(act==='pause') fields.note=String(F.pwhy||'').trim();

  catch(e){ st.busy=false; st.sheet=false; F.err='Nothing was sent. Try again; if it happens twice, tell the desk. ('+(e.message||e)+')'; return render(); }

  if(act==='done'){ F.dnote=''; F.dphotos=[]; }
  if(act==='flag'){ F.why=''; F.level=''; F.ftried=false; }
  if(act==='pause'){ F.pwhy=''; F.ptried=false; }
  if(act==='assign'){ F.asg=[]; F.asgSend=null; F.atried=false; }
  st.sheet=false; render();

  toast(ok?'Sent':c.errCode==='refused'?'Not sent: '+(c.err||'the site refused it')+' It is kept on this phone.':'Waiting for signal. It sends by itself.');
}

  const uns={}; (W.unscanned||[]).forEach(u=>{ uns[u.point]=u; });
  const n=r.points.filter(id=>seen[id]).length, nu=r.points.filter(id=>uns[id]).length, next=r.points.find(id=>!seen[id]&&!uns[id]), np=next?pointById(next):null;

}

    h+='</div>'; });

// Digits typed as they read across a dial, with the point put in its place (DEC-0284). The desk's
// wfmDialFix is the same rule; the places come from the desk in the site file.
function dialFix(v,dp){ let d=String(v||'').replace(/\D/g,'').replace(/^0+(?=\d)/,''); if(!d||!dp) return d; while(d.length<=dp) d='0'+d; return d.slice(0,-dp)+'.'+d.slice(-dp); }

// One figure at a meter: as the dial or gauge shows it, with the last reading beside it. A dial only counts up, so a
// figure below the last one is stopped here as the desk would refuse it (DEC-0282).
function vMeterReading(F,p,r){
  const v=num(F.value), n=x=>Number(x).toLocaleString('en-IE');
  const typedBad=F.left&&F.left.value&&F.value&&v==null;
  const digits=x=>String(x).replace(/\D/g,'').replace(/^0+/,'').length;
  // Judged once as many digits are in as the last reading has, so it does not flash while typing.
  const back=v!=null&&r.dial&&r.last&&Number(v)<r.last.value&&digits(v)>=digits(Number(r.last.value).toFixed(r.dp>0?r.dp:0));
  const what=r.dial?'On the dial':(r.unit==='litres'?'In the tank':'Used');
  const dp=r.dial&&r.dp>0?r.dp:0;
  const eg=dp?(r.last?Number(r.last.value).toFixed(dp):'285312.1'):'';
  const how=dp?' Type every digit as it reads across the dial, including those after the point. The point goes in for you: '+eg.replace('.','')+' is '+Number(eg).toLocaleString('en-IE',{minimumFractionDigits:dp,maximumFractionDigits:dp})+'.':'';
  return '<div class="body">'+formZone('home',r.label,p.name,esc(p.where||'')+'. '+(r.last?'Last read <b class="n">'+esc(n(r.last.value))+'</b> '+esc(r.unit||'')+' on <b class="n">'+esc(day(r.last.date))+'</b>.':'No reading on record yet, so there is nothing to compare it with.'))
    +'<div class="field"><label for="f-value">'+esc(what)+'</label><label class="fig"><input id="f-value" type="text" inputmode="'+(dp?'numeric':'decimal')+'" autocomplete="off" placeholder="–" value="'+esc(F.value||'')+'" data-in="value"><span class="u">'+esc(r.unit||'')+'</span></label>'
    +(typedBad?'<div class="help err" role="alert">Enter the figure as the '+(r.dial?'dial':'meter')+' shows it, with no spaces or commas, like 285312.1.</div>'
      :back?'<div class="help err" role="alert">That is lower than the last reading. A dial does not run backwards, so check the figure on the dial.</div>'
      :'<div class="help">'+esc((dp?'':(r.says||''))+how)+' '+(p.picked?'Picked from the list, not scanned at the meter, and the record says so. ':'')+'Added to the meter on the desk when it files.</div>')+'</div>'
    +photosField(r.dial?'Photo of the dial':'Photo of the gauge',true)+'<div style="height:24px"></div></div>'
    +sendBtn('Send Reading',v!=null&&!back,back?'':'Enter the figure.');
}

let _stream=null,_raf=0,_detector=null;
async function scanStart(){
  const S=st.scanFor; if(!S) return;
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ S.live=false; S.say='The camera cannot run live on this connection. Take a photo of the tag instead.'; render(); return; }
  try{
    _stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    S.live=true; render();
    const v=app.querySelector('.scan video'); v.srcObject=_stream; await v.play();
    if('BarcodeDetector' in window){ try{ _detector=new BarcodeDetector({formats:['qr_code']}); }catch(e){ _detector=null; } }
    if(!_detector) await loadJsQR();
    tickScan();
  }catch(e){ S.live=false; S.say='The camera is not available. Take a photo of the tag instead.'; render(); }
}
function scanStop(){ cancelAnimationFrame(_raf); if(_stream){ _stream.getTracks().forEach(t=>t.stop()); _stream=null; } }
function loadJsQR(){
  if(window.jsQR) return Promise.resolve();
  return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s); });
}
const _cv=document.createElement('canvas');
async function decodeFrom(src,w,h){
  if(_detector){ const r=await _detector.detect(src); return r[0]&&r[0].rawValue||''; }
  const k=Math.min(1,960/Math.max(w,h)); _cv.width=Math.round(w*k); _cv.height=Math.round(h*k);
  const cx=_cv.getContext('2d',{willReadFrequently:true}); cx.drawImage(src,0,0,_cv.width,_cv.height);
  const d=cx.getImageData(0,0,_cv.width,_cv.height), r=window.jsQR(d.data,d.width,d.height);
  return r?r.data:'';
}
let _busyScan=false;
function tickScan(){
  _raf=requestAnimationFrame(async()=>{
    const v=app.querySelector('.scan video');
    if(!v||!st.scanFor) return;
    if(!_busyScan&&v.readyState>=2){
      _busyScan=true;
      try{ const t=await decodeFrom(v,v.videoWidth,v.videoHeight); if(t){ _busyScan=false; return scanned(t,'qr'); } }catch(e){}
      _busyScan=false;
    }
    tickScan();
  });
}
async function scanPhoto(file){
  const S=st.scanFor; S.err=''; S.say='Reading the tag…'; render();
  try{
    if(!('BarcodeDetector' in window)) await loadJsQR(); else if(!_detector) _detector=new BarcodeDetector({formats:['qr_code']});
    const bm=await createImageBitmap(file), t=await decodeFrom(bm,bm.width,bm.height);
    if(t) return scanned(t,'qr');
    S.say=''; S.err='No QR code found in that photo. Fill the frame with the sticker and try again.'; render();
  }catch(e){ S.say=''; S.err='That photo could not be opened. Take it again, or pick a different photo.'; render(); }
}
// Every scan comes through here, from the camera, a photo, or the check page.
function scanned(text,via){
  const S=st.scanFor; if(!S) return;
  const m=/^WATERLINE:PT:(.+)$/.exec(String(text||'').trim());
  if(!m){ S.err='That code is not a Waterline tag. Scan the QR code on the Waterline sticker.'; render(); if(S.live) tickScan(); return; }
  const id=m[1], p=pointById(id);
  if(!p&&S.for!=='where'){ S.err='This tag is not in the site details from the desk'+(st.site&&st.site.published?' (published '+day(st.site.published)+')':'')+'. If it is new, the desk publishes it the next time it reads the Inbox.'; render(); if(S.live) tickScan(); return; }
  if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
  const F=st.form, at=new Date().toISOString();
  scanStop(); st.scanFor=null;
  if(S.for==='where'){ F.point=id; F.via=via; F.place=''; }
  else if(S.for==='reading'){
    if(!p.reading){ F.scanErr=p.name+' is not an outlet or a meter the desk takes readings at. Scan the tag on the outlet or the meter.'; }
    else { F.point=id; F.meter=''; F.scanErr=''; }
  } else if(S.for==='walk'){
    const r=roundById(F.round), prev=F.scans.find(x=>x.point===id);
    if(r.points.indexOf(id)<0){ F.msg=(p?p.name:id)+' is not on this round. Nothing was recorded.'; F.msgTone='amber'; }
    else if(prev){ F.msg=(p?p.name:id)+' was already scanned at '+hm(prev.at)+'.'; F.msgTone=''; }
    else { F.scans.push({point:id,at:at,via:via}); F.msg=(p?p.name:id)+' scanned at '+hm(at)+'.'; F.msgTone='green'; ls.set('wl_walk',F); }
  }
  render();
}

  if(a==='jobAssign'){ const j=jobById(F.id); F.asg=j?asgNow(j):[]; F.atried=false; st.sheet='jassign'; render(); const v=app.querySelector('.sheet .opt'); if(v) v.focus(); return; }
  if(a==='jasg'){ const v0=b.dataset.v, i=F.asg.indexOf(v0); if(i>=0) F.asg.splice(i,1); else F.asg.push(v0); render(); const v=app.querySelector('.sheet .opt[data-v="'+CSS.escape(v0)+'"]'); if(v) v.focus(); return; }
  if(a==='jobAssignSend'){ const j=jobById(F.id), base=j?asgNow(j):[], on=F.asg.filter(x=>base.indexOf(x)<0), off=base.filter(x=>F.asg.indexOf(x)<0);
    if(!on.length&&!off.length){ F.atried=true; render(); return; } F.asgSend={on:on,off:off}; return jobSend('assign'); }
  if(a==='jobFlag'){ const j=jobById(F.id); if(j&&j.flag){ if(!F.level) F.level=j.flag.level; if(!F.why) F.why=j.flag.why||''; } F.ftried=false; st.sheet='jflag'; render(); const v=app.querySelector('.sheet .opt'); if(v) v.focus(); return; }
  if(a==='jlevel'){ F.level=b.dataset.v; render(); const v=app.querySelector('.sheet .opt.on'); if(v) v.focus(); return; }
  if(a==='jobFlagSend'){ if(!F.level){ F.ftried=true; render(); const t=app.querySelector('.sheet .opt'); if(t) t.focus(); return; } return jobSend('flag'); }
  if(a==='dphotoDel'){ const p=F.dphotos.splice(Number(b.dataset.i),1)[0]; if(p&&p.url) URL.revokeObjectURL(p.url); return render(); }
  if(a==='send') return doSend();
});
app.addEventListener('input',e=>{
  const k=e.target.dataset.in; if(!k||!st.form) return;
  if(special(k,e.target)) return;
  st.form[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;
  if(k==='value'){ const F=st.form, p=F.point?pointById(F.point):(F.meter?meterAsPoint(F.meter):null), dp=p&&p.reading&&p.reading.dial&&p.reading.dp>0?p.reading.dp:0;
    if(dp){ const fx=dialFix(e.target.value,dp); if(e.target.value!==fx) e.target.value=fx; F.value=fx; } }
  if(k==='place'){ st.form.picked=false; st.form.loc=''; }
  if(st.form.left&&(k==='hot'||k==='cold'||k==='value')) st.form.left[k]=false;   // judged again on the next blur
  if(k==='hot'||k==='cold'||k==='value') return softRender();
  // Re-render only what depends on the typing, keeping focus and the caret where they are.
  const id=e.target.id, pos=e.target.selectionStart;
  render();
  const el=id&&document.getElementById(id);
  if(el&&el!==document.activeElement){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(x){} }
});
// The Jobs search: typed, the list follows, the caret stays where it was.
app.addEventListener('input',e=>{ if(!e.target.hasAttribute('data-jq')) return; st.J.q=e.target.value; const pos=e.target.selectionStart; render();
  const el=app.querySelector('[data-jq]'); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(x){} } });
app.addEventListener('focusout',e=>{
  const k=e.target.dataset&&e.target.dataset.in;
  if(!st.form||(k!=='hot'&&k!=='cold'&&k!=='value')) return;
  st.form.left=st.form.left||{}; if(st.form.left[k]) return;
  st.form.left[k]=true; setTimeout(softRender,0);
});
app.addEventListener('change',e=>{
  const k=e.target.dataset.file;
  if(k==='photos'){ Array.from(e.target.files||[]).forEach(f=>st.form.photos.push({file:f,url:/^image\//.test(f.type)?URL.createObjectURL(f):''})); return render(); }
  if(k==='dphotos'){ Array.from(e.target.files||[]).forEach(f=>st.form.dphotos.push({file:f,url:/^image\//.test(f.type)?URL.createObjectURL(f):''})); return render(); }
  if(k==='tagphoto'){ const f=e.target.files&&e.target.files[0]; if(f) scanPhoto(f); return; }
  if(k==='uphoto'){ const f=e.target.files&&e.target.files[0]; if(f){ st.form.photos.push({file:f,url:URL.createObjectURL(f)}); st.form.u.photo=st.form.photos.length-1; } return render(); }
  if(k==='ansphoto'){ const f=e.target.files&&e.target.files[0], key=e.target.dataset.k; if(f){ st.form.photos.push({file:f,url:URL.createObjectURL(f)}); st.form.ans[key].photos.push(st.form.photos.length-1); } return render(); }
  if(e.target.tagName==='SELECT'&&e.target.dataset.in){ if(special(e.target.dataset.in,e.target)) return; st.form[e.target.dataset.in]=e.target.value; render(); }
});
// Fields that live inside the form's parts: the tag that will not scan, a No's sentence.
function special(k,el){
  const F=st.form;
  if(st.screen==='job'&&(k==='note'||k==='why'||k==='dnote')){ F[k]=el.value; return true; }
  if(k==='pid'){ F.pid=el.value; const p=PEOPLE().find(x=>x.id===el.value);
    if(p){ F.name=p.name; if(positions().some(x=>x.id===p.position)) F.pos=p.position; } else if(el.value==='__other'||!el.value) F.name='';
    render(); return true; }
  if(k==='upt'||k==='ureason'){ F.u[k==='upt'?'point':'reason']=el.value; if(k==='upt') return true; softKeep(el); return true; }
  if(k==='ansnote'){ const key=el.dataset.k; F.ans[key]=F.ans[key]||{note:'',photos:[]}; F.ans[key].note=el.value; ls.set('wl_walk',walkKeep(F)); softKeep(el); return true; }
  return false;
}
function softKeep(el){ const id=el.id, pos=el.selectionStart; render(); const n=id&&document.getElementById(id); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } }
// A walk survives the page closing: its scans and answers are kept, its photos are not (they live in the form only).
function walkKeep(F){ const o=Object.assign({},F); o.photos=[]; o.u=null; o.unscanned=(F.unscanned||[]).map(u=>Object.assign({},u,{photo:null})); o.ans={}; Object.keys(F.ans||{}).forEach(k=>{ o.ans[k]=Object.assign({},F.ans[k],{photos:[]}); }); return o; }
// A capture that could not be sent is sent again by itself until it is (DEC-0291 rule 2).
async function retry(){ if(!st.outbox.length||st.busy||navigator.onLine===false) return; const before=st.outbox.length; await sendKept(); if(st.outbox.length<before){ toast(st.outbox.length?'Sent '+(before-st.outbox.length)+'; '+st.outbox.length+' still waiting':'Sent'); } if(!st.form||['due','me','job'].indexOf(st.screen)>=0) keepRender(); }
window.addEventListener('online',retry);
// The desk's file is read again while the page is open: every minute and on coming back to it, so what was sent turns
// into what the desk filed without closing the app (John, 20 Oct 2026). Never redrawn under a sheet, the scanner or a
// field in use: the new file is kept and the next screen draws it.
async function siteRefresh(){
  if(!STORE||st.busy||document.visibilityState==='hidden'||st.screen==='start'||st.screen==='setup') return;
  const was=st.site&&st.site.published; await loadSite();
  if(!st.site||st.site.published===was) return;
  jSentPrune();
  const a=document.activeElement;
  if(st.sheet||st.scanFor||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
  const y=window.scrollY; render(); window.scrollTo(0,y);
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ retry(); siteRefresh(); } });
setInterval(retry,60000);
setInterval(siteRefresh,60000);

async function doSend(){
  const F=st.form; if(st.busy) return;
  st.busy=true; render();
  F.err='';
  let fields={note:String(F.note||'').trim()};
  // A tag's name and place are the desk's to read from its record every time (Law 3; slice C2), so they
  // are not copied into the capture. A tag the site details do not know yet still sends its id.
  if(F.point) fields.point=F.point;
  else if(F.kind==='reading'&&F.meter) fields.record={reg:'meterItems',id:F.meter};
  else fields.place=String(F.place||'').trim();
  if(F.loc&&!F.point) fields.loc=F.loc;
  if(F.duty) fields.duty=F.duty;
  const kind=F.kind==='proof'?F.what:F.kind;
  if(F.kind==='fault') fields.group=F.group||'maintenance';
  if(F.kind==='reading'){
    const p=F.point?pointById(F.point):meterAsPoint(F.meter), r=p.reading;
    // Named figures (Work 015 plan, D2b). The desk's reader takes them from v458.
    if(r.kind==='meter') fields.reading={unit:r.unit||'',value:num(F.value)};
    else{
      fields.reading={unit:r.unit||''}; if(r.hot) fields.reading.hot=num(F.hot); if(r.cold) fields.reading.cold=num(F.cold);
      if(!r.hot&&!r.cold){ fields.outcome='Run and flushed'; fields.reading=null; }
    }
  }
  if(F.kind==='round'){
    // The walk's record (DEC-0294): scans, the points not scanned with their reason and photo, the
    // checklist answered once, and who signed it off when. Photo slots are filled in once named.
    const r=roundById(F.round), seen=F.scans.map(x=>x.point), miss=r.points.filter(id=>seen.indexOf(id)<0);
    fields={round:F.round,started:F.started,scans:F.scans,complete:F.complete,
      answers:r.lines.map(id=>{ const a=F.ans[id]; return {line:id,ok:a.ok,note:a.ok?'':String(a.note||'').trim(),files:a.ok?[]:(a.photos||[])}; }),
      unscanned:(F.unscanned||[]).map(u=>({point:u.point,reason:u.reason,file:u.photo})),
      signedOff:{by:st.walker,at:new Date().toISOString()},
      outcome:miss.length?'Done, gap named':'Done',
      note:miss.length?'Not scanned: '+miss.map(id=>{const p=pointById(id);return p?p.name:id;}).join(', ')+'.':''};
  }
  let c;
  try{
    c=await makeCapture(F.kind==='round'?'round':kind,fields,F.photos);
    if(F.kind==='round'){ const nm=i=>(i!=null&&c.files[i])?c.files[i].name:'';
      (c.record.answers||[]).forEach(x=>{ x.files=x.files.map(nm).filter(Boolean); });
      (c.record.unscanned||[]).forEach(u=>{ u.file=nm(u.file); }); }
  }
  catch(e){ st.busy=false; F.err='Nothing was sent. Take the photos again and send it again; if it happens twice, tell the desk. ('+(e.message||e)+')'; return render(); }
  const ok=await send(c);
  st.outbox=await obAll().catch(()=>st.outbox); st.busy=false;
  if(F.kind==='round'){ ls.del('wl_walk'); const w=walksSent(); w.push({round:F.round,at:new Date().toISOString()}); ls.set('wl_walksSent',w); }
  F.photos.forEach(p=>p.url&&URL.revokeObjectURL(p.url));
  st.form=null;
  // Back to where the person was, said once (Design 9.10); a capture that waits says so on the screen (Design 9.11).
  go('due');
  toast(ok?'Sent':c.errCode==='refused'?'Not sent: '+(c.err||'the site refused it')+' It is kept on this phone.':'Waiting for signal. It sends by itself.');
}

async function home(){
  st.outbox=await obAll().catch(()=>st.outbox);
  if(st.outbox.length&&navigator.onLine!==false) await sendKept();
  jSentPrune(); phPrune().catch(()=>{});
  if(st.screen==='start'){ bootStep(3,'Ready'); await new Promise(r=>setTimeout(r,300)); }
  const walk=ls.get('wl_walk',null);
  if(walk&&walk.round&&roundById(walk.round)){ st.form=Object.assign({unscanned:[],ans:{},photos:[]},walk); return go('walk'); }
  go('due');
}
async function boot(){
  document.body.className='t-'+theme();
  render();
  if(!STORE){ st.form={link:''}; return go('setup'); }
  st.account=await STORE.account();
  bootStep(1,'Reading the site details');
  await loadSite();
  bootStep(2,'Checking what is waiting to send');
  const w=whoGet(); st.walker=w&&w.name||''; st.pos=w&&w.pos||''; st.pid=w&&w.pid||'';
  if(!st.walker||!st.pos) return go('who');
  home();
}

if(STORE) window.wfmPhoneTest={scanned:scanned,state:st,render:render,siteRefresh:siteRefresh};
// Keeps the page itself on the phone so it opens with no signal (DEC-0287 rule 3). Not in the check.
if('serviceWorker' in navigator&&!testStore()&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
