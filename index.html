<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F7F9">
<title>Waterline</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="push/icon-192.png">
<link rel="apple-touch-icon" href="push/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800;900&family=Outfit:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Waterline Capture, the phone page (Work 015). Drawn to Design §21, the phone (DEC-0307), from render round 12
   (sandbox/mockups/phone-2026-10-20/round12.html). Every screen: one navy zone (21.1); teal on what can be
   pressed and nothing else (21.2); red and amber only where the desk's urgency function put them (21.3);
   cream page, white sheet, stone for what a row opens, navy for the zone (21.4); type in Design 6.3's roles at
   the 15px scale (21.5); one icon set, Lucide at 1.75 on a 24px grid (21.7); controls 44px or more (9.12);
   gaps from Design 4.6 (4 8 12 16 20 24 32 44 64). Inputs stay 16px, below which iOS zooms the page.
   Themes: the desk's THEMES (Design 5.2), Waterline, Light and Night, switched in Settings by anyone (DEC-0303 rule 4). */
body.t-wl{--cream:#F5F7F9;--white:#FFFFFF;--stone:#E4EEF4;--ink:#0D1F2D;--onInk:#FFFFFF;--navMid:rgba(255,255,255,.72);--onInkMid:rgba(255,255,255,.6);--inkTrack:rgba(255,255,255,.16);
  --text:#0D1F2D;--textMid:#3A5A72;--textMuted:#4A6E8C;--textMS:#4A6E8C;--border:#D4E3EC;--accent:#1E87A8;--accentD:#156B87;--accentOnInk:#3AABC6;--btnFill:#156B87;--btnText:#FFFFFF;--zBtnText:#071320;
  --red:#DC2626;--redText:#991B1B;--amber:#D97706;--amberText:#92400E;--inkRed:#F87171;--inkAmber:#FBBF24;--jTodo:#DC2626;--jDoing:#B8860B;--jDone:#16A34A;--sTodo:#F87171;--sDoing:#FACC15;--sDone:#34D399}
body.t-li{--cream:#F5F7F9;--white:#FFFFFF;--stone:#E4EEF4;--ink:#0D1F2D;--onInk:#FFFFFF;--navMid:rgba(255,255,255,.72);--onInkMid:rgba(255,255,255,.6);--inkTrack:rgba(255,255,255,.16);
  --text:#0D1F2D;--textMid:#3A5A72;--textMuted:#4A6E8C;--textMS:#4A6E8C;--border:#D4E3EC;--accent:#1E87A8;--accentD:#156B87;--accentOnInk:#3995B2;--btnFill:#156B87;--btnText:#FFFFFF;--zBtnText:#071320;
  --red:#DC2626;--redText:#991B1B;--amber:#D97706;--amberText:#92400E;--inkRed:#F87171;--inkAmber:#FBBF24;--jTodo:#DC2626;--jDoing:#B8860B;--jDone:#16A34A;--sTodo:var(--jTodo);--sDoing:var(--jDoing);--sDone:var(--jDone)}
/* Light on the phone (John, 21 Oct 2026, DEC-0310): the desk's Light differs from Waterline only in its sidebar, which the
   phone has not got, so on the phone Light turns the top block white with navy words. Its words, teal and state colours
   take the light-surface tokens; the block keeps its place, its one action and its hairline under it. */
body.t-li .zone{background:var(--white);border-bottom:1px solid var(--border);--onInk:#0D1F2D;--navMid:#3A5A72;--inkTrack:#E4EEF4;--accentOnInk:#156B87;--zBtnText:#FFFFFF;--inkRed:#991B1B;--inkAmber:#92400E}
body.t-li .zone .prog i,body.t-li .zone .fill,body.t-li .zone .steps span.d{background:var(--text)}
body.t-ni{--cream:#091624;--white:#0D2035;--stone:#122840;--ink:#071320;--onInk:#FFFFFF;--navMid:rgba(255,255,255,.72);--onInkMid:rgba(255,255,255,.6);--inkTrack:rgba(255,255,255,.16);
  --text:#C8E5F2;--textMid:#6A9BB5;--textMuted:#5490AB;--textMS:#6A9BB5;--border:#1C3A52;--accent:#3AABC6;--accentD:#7ECFE0;--accentOnInk:#5BBDD4;--btnFill:#3AABC6;--btnText:#071320;--zBtnText:#071320;
  --red:#F87171;--redText:#F87171;--amber:#FBBF24;--amberText:#FBBF24;--inkRed:#F87171;--inkAmber:#FBBF24;--jTodo:#F87171;--jDoing:#FACC15;--jDone:#34D399;--sTodo:var(--jTodo);--sDoing:var(--jDoing);--sDone:var(--jDone)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;text-align:inherit}
/* Design 12.7: the focus ring is 2px solid accent, offset 2px, on every focusable element. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;min-height:100vh;min-height:100dvh}
.body{flex:1;padding-top:env(safe-area-inset-top)}
.n{font-family:Sora,sans-serif;font-variant-numeric:tabular-nums}
.mono{font:400 12px ui-monospace,'SFMono-Regular',Consolas,monospace;color:var(--textMid)}
svg{width:24px;height:24px;flex:none;display:block}
.hide{display:none!important}

/* the page title, on the page surface (Design 6.3, 4.13.1); nothing about the person (DEC-0302) */
.ttl{font:800 20px/1.3 Sora;padding:16px 16px}
.grp{font:700 11px Outfit;letter-spacing:2px;text-transform:uppercase;color:var(--textMuted);padding:24px 16px 8px}
/* the one navy zone (21.1) */
.zone{background:var(--ink);color:var(--onInk);padding:16px 16px 24px}
.eb{display:block;font:700 11px Outfit;letter-spacing:2px;text-transform:uppercase;color:var(--navMid)}
.ztop{display:flex;align-items:center;gap:8px;margin:-8px 0 8px -12px}
.zone .row1{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:4px}
.zone .num{font:900 72px/1 Sora;letter-spacing:-.04em}
.zone .what{font:800 20px/1.3 Sora;padding-bottom:8px}
.zone h1{font:800 20px/1.3 Sora;margin-top:4px;color:var(--onInk)}
.zone p{color:var(--navMid);margin-top:8px}
.zone p b{color:var(--onInk);font-weight:500}
.zone .mono{color:var(--navMid)}

/* buttons (Design 9.1, 5.11): one primary; ghosts carry a 1px teal edge */
.btn{min-height:48px;border-radius:8px;font:600 13px Outfit;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 16px;background:var(--btnFill);color:var(--btnText)}
.zone .btn{background:var(--accentOnInk);color:var(--zBtnText);margin-top:16px}
.btn[disabled]{background:var(--stone);color:var(--textMid);cursor:default}
.gh,.btn.g{min-height:48px;border-radius:8px;border:1px solid var(--accentD);color:var(--accentD);background:transparent;font:600 13px Outfit;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 16px}
.zone .gh{border-color:var(--accentOnInk);color:var(--accentOnInk);margin-top:12px}
.lnk{color:var(--accentD);font:600 13px Outfit;display:inline-flex;align-items:center;gap:4px;min-height:44px;text-decoration:underline;text-underline-offset:4px;flex:none}
.ib{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--accentD);flex:none;position:relative;border:2px solid transparent}
.ib.on{border-color:var(--accentD)}
.zone .ib{color:var(--accentOnInk)}
.ib.ov{background:var(--white);border-radius:22px;border:none}
.ib .bd{position:absolute;top:0;right:0;min-width:20px;height:20px;border-radius:10px;background:var(--accentD);color:var(--btnText);font:800 11px/20px Sora;text-align:center;padding:0 4px}
.pad{padding:12px 16px 0}
.row2{display:flex;gap:8px}
.row2>*{flex:1}

/* lists and rows: stripe, words, state; no icon tile, no chevron; the whole row is the target (21.2) */
.list{background:var(--white);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.r{position:relative;display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 16px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.r:last-child{border-bottom:none}
.r .s3{position:absolute;left:0;top:0;bottom:0;width:3px}
.r .m{flex:1;min-width:0}
.r .w{display:block;font-weight:500;line-height:1.4}
.sub{display:block;font-size:12px;line-height:1.4;color:var(--textMuted);margin-top:4px}
.r .st{flex:none;text-align:right;max-width:128px}
.r .st b{display:block;font:800 15px Sora}
.r .st i{display:block;font:400 12px 'DM Sans';font-style:normal}
/* a category opened the desk's way (DEC-0140): one stone band; each line's own tier dashed down its edge (DEC-0252) */
.cat .w{font:700 15px/1.4 Sora}
.cat.open{background:var(--stone);border-bottom:none}
.inner{background:var(--stone);border-bottom:1px solid var(--border)}
.inner .r{border-bottom:none;border-top:1px solid var(--border);align-items:flex-start}
.inner .sub,.cat.open .sub,.no .sub{color:var(--textMS)}
.badge{display:inline-block;font:700 11px/20px Outfit;padding:0 8px;border-radius:4px;border:1px solid var(--border);color:var(--textMid);background:var(--white)}
.wait{padding:12px 16px;background:var(--white);border-bottom:1px solid var(--border);color:var(--textMid);line-height:1.6}
.wait b{color:var(--text);font-weight:500}
.para{color:var(--textMid);padding:16px}
.note{margin:12px 16px 0;padding:12px;background:var(--white);border:1px solid var(--border);border-radius:8px;color:var(--textMid)}
.note .eb{color:var(--textMuted);margin-bottom:4px}
.note b{color:var(--text);font-weight:500}
.f{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:12px 16px;border-bottom:1px solid var(--border);line-height:1.4}
.f:last-child{border-bottom:none}
.f .k{width:96px;flex:none;font:600 12px/20px Outfit;color:var(--textMid)}
.f .v{flex:1;min-width:0}
.f .lnk{margin:-12px 0}

/* the bar: Due · Jobs · Capture · Settings. Every tab is pressable, so teal; the chosen one underlined (21.2).
   Capture is the main button in the middle (DEC-0301, DEC-0303 rule 2); the bar paints over the page. */
.navb{position:sticky;bottom:0;z-index:5;display:flex;align-items:flex-start;height:calc(80px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--white);border-top:1px solid var(--border)}
.navb .side{flex:1;display:flex}
.nv{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 11px Outfit;letter-spacing:1.5px;text-transform:uppercase;color:var(--accentD)}
.nv.on span{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.nv.cap{flex:none;width:88px;height:80px;justify-content:flex-start;margin-top:-24px}
.nv.cap .capb{width:56px;height:56px;border-radius:50%;background:var(--btnFill);color:var(--btnText);display:grid;place-items:center;box-shadow:0 0 0 4px var(--white)}

/* who's in today (DEC-0329): the button sits in the title row; initials ring solid when matched, dashed when not */
.ttlr{display:flex;align-items:center;padding-right:8px}
.ttlr .ttl{flex:1;min-width:0}
.sh .when{display:block;font:400 12px/1.4 'DM Sans';color:var(--textMuted);margin-top:2px}
.gr2{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.gr2 .t{font:600 12px Sora;letter-spacing:0;text-transform:none;color:var(--textMid);font-variant-numeric:tabular-nums}
.inr{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 16px;border-bottom:1px solid var(--border);line-height:1.4}
.inr .m{flex:1;min-width:0}
.inr .nm{font-size:15px;font-weight:500}
.inr .sub{margin-top:0}
.inr .rt{font:600 12px Sora;color:var(--textMuted);flex:none;font-variant-numeric:tabular-nums}
.ini{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font:800 15px Sora;color:var(--text);border:1.5px solid var(--textMid)}
.ini.un{border-style:dashed;border-color:var(--textMuted);color:var(--textMid)}
.inr.none{color:var(--textMid);min-height:48px}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(13,31,45,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;background:var(--white);border-radius:12px 12px 0 0;max-height:88vh;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 4px 16px}
.sh b{font:800 20px Sora}
.sheet .grp{padding-top:8px}
.opts{background:var(--white);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.sheet .opts{border-top:none}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 16px;border-bottom:1px solid var(--border);width:100%;text-align:left;line-height:1.4}
.opt:last-child{border-bottom:none}
.opt .m{flex:1;min-width:0}
.opt .rt{font-size:12px;color:var(--textMuted);flex:none}
.rad{width:24px;height:24px;border-radius:50%;border:2px solid var(--accentD);flex:none}
.opt.on .rad{box-shadow:inset 0 0 0 4px var(--white),inset 0 0 0 12px var(--accentD)}
.ck{width:24px;height:24px;border-radius:4px;border:2px solid var(--accentD);flex:none;position:relative;color:var(--btnText)}
.opt.on .ck{background:var(--accentD)}
.ck svg{position:absolute;left:-2px;top:-2px}
.sfoot{display:flex;gap:8px;padding:16px 16px 24px;position:sticky;bottom:0;background:var(--white);border-top:1px solid var(--border)}
.verb{display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 16px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.verb:last-child{border-bottom:none}
.verb svg{color:var(--accentD)}
.verb .w{display:block;font-weight:500}
.verb .sub{margin-top:0}
.verb[disabled]{cursor:default}
.verb[disabled] svg{color:var(--textMuted)}
.verb[disabled] .w{color:var(--textMid)}

/* forms */
.field{padding:16px 16px 0}
.field>label,.field>.fl{display:block;font:600 12px Outfit;color:var(--text);margin-bottom:8px}
.field .opt-w{color:var(--textMuted)}
textarea,input[type=text],input[type=url],input[type=search],input[type=number],input[type=time],select{width:100%;background:var(--white);border:1.5px solid var(--accentD);border-radius:8px;padding:12px;font-size:16px;line-height:1.4;min-height:48px;color:var(--text)}
textarea{min-height:96px;resize:vertical}
::placeholder{color:var(--textMuted);opacity:1}
.help{font-size:12px;line-height:1.4;color:var(--textMuted);margin-top:8px}
/* parts used (W): a line is the thing and how many */
.pl{display:flex;gap:8px;align-items:flex-end;padding:8px 16px 0}
.pl .w{flex:1;min-width:0}
.pl .q{width:96px;flex:none}
.pl .fl{display:block;font:600 12px Outfit;color:var(--text);margin-bottom:8px}
.sheet .para{padding:0 16px}
.pr dl{margin:0;padding:0 16px 8px}.pr dt{font:600 12px Outfit;color:var(--text);margin-top:16px}.pr dd{margin:4px 0 0;color:var(--text)}.pr dd .sub{display:block;font-size:12px;color:var(--textMuted)}.pr dd .mono{font-size:15px;color:var(--text)}.pr dd ul{margin:8px 0 0;padding-left:20px}.pr dd li{margin-top:4px}
.help.err{color:var(--text)}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0}
.inrow .gh{width:auto;flex:none}
.sugg{margin-top:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.chosen{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:4px 4px 4px 12px;min-height:48px;line-height:1.4}
.chosen .m{flex:1;min-width:0}
.keep{display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer;line-height:1.4}
.keep input{width:24px;height:24px;flex:none;accent-color:var(--accentD)}
.foot{position:sticky;bottom:0;z-index:4;background:var(--white);border-top:1px solid var(--border);padding:12px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.foot .sub{margin-top:0}
.foot .note{margin:0}
.seg{display:flex;gap:8px;padding:0 16px}
.seg.col{flex-direction:column;padding:0}
.seg button{flex:1;min-height:48px;border-radius:8px;border:1px solid var(--accentD);color:var(--accentD);font:600 13px Outfit;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 12px}
.seg.col button{justify-content:flex-start}
.seg button.on{border-width:2px}
/* photos */
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{width:88px;height:88px;border-radius:8px;background:var(--stone) center/cover no-repeat;position:relative;display:grid;place-items:center;font:700 11px Outfit;color:var(--textMid)}
.th .x{position:absolute;top:-8px;right:-8px;width:44px;height:44px;display:grid;place-items:center;color:var(--accentD)}
.th .x i{display:grid;place-items:center;width:32px;height:32px;border-radius:16px;background:var(--white);border:1px solid var(--accentD)}
.th.add{background:var(--white);border:1px solid var(--accentD);color:var(--accentD);cursor:pointer}
.th.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* a reading: the figure at stat size (Design 6.2) */
.fig{display:flex;align-items:baseline;gap:8px;border:1.5px solid var(--accentD);border-radius:8px;background:var(--white);padding:8px 12px;min-height:80px}
.fig input{font:800 48px/1 Sora;letter-spacing:-.04em;font-variant-numeric:tabular-nums;border:none;background:none;width:100%;min-width:0;padding:0;min-height:64px;color:var(--text)}
.fig input:focus{outline:none}
.fig:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.fig .u{font-size:15px;color:var(--textMid);flex:none}
.field>label.fig{display:flex;font:400 15px/1.6 'DM Sans',sans-serif;color:var(--text);margin-bottom:0}
/* yes / no (DEC-0294): chosen is a heavier teal edge and a check, never a fill */
.q{padding:12px 16px 16px;border-bottom:1px solid var(--border)}
.q:last-child{border-bottom:none}
.q .w{font-weight:500;line-height:1.4}
.yn{display:flex;gap:8px;margin-top:8px}
.yn button{flex:1;min-height:56px;border-radius:8px;border:1px solid var(--accentD);color:var(--accentD);font:600 13px Outfit;display:flex;align-items:center;justify-content:center;gap:4px}
.yn button.on{border-width:2px}
.unans{font-size:12px;color:var(--text);margin-top:8px}
.no{margin-top:12px;padding:12px;background:var(--stone);border-radius:8px}
.no .sub{margin-top:0}
.no input{margin-top:8px}
.no .thumbs{margin-top:8px}
/* the walk: the next point leads, what is left follows (audit F1) */
.prog{height:4px;border-radius:2px;background:var(--inkTrack);margin-top:16px;overflow:hidden}
.prog i{display:block;height:4px;background:var(--onInk)}
.steps{display:flex;gap:4px;margin-top:16px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--inkTrack)}
.steps span.d{background:var(--onInk)}
.stepl{display:flex;justify-content:space-between;margin-top:8px;font:700 11px Outfit;letter-spacing:1.5px;text-transform:uppercase;color:var(--navMid)}
.stepl b{color:var(--onInk);font-weight:700}
/* jobs: the photo leads (DEC-0305); with none, the job's own words in its place */
.pic{display:grid;place-items:center;text-align:center;flex:none;border-radius:8px;overflow:hidden;padding:8px;background:var(--stone);color:var(--text);font:400 12px/1.4 'DM Sans';align-content:center;gap:4px}
.pic i{font:700 11px Outfit;font-style:normal;color:var(--textMS)}
.pic.sm{width:88px;height:88px}
.pic.wide{width:100%;aspect-ratio:4/3;border-radius:0}
.hp{position:relative}
.hp .pic.wide{aspect-ratio:auto;height:160px;font:800 20px/1.3 Sora;padding:24px 64px}
.hp .ov{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top))}
.ra{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:flex-start;width:100%;text-align:left}
.ra:last-child{border-bottom:none}
.ra .m{flex:1;min-width:0}
.ra .w,.cb .w{display:block;font-weight:500;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.cb{background:var(--white);border:1px solid var(--border);border-radius:8px;overflow:hidden;text-align:left;display:block}
.cbt{padding:8px 12px 12px}
.sw{display:flex;margin:16px -16px -24px;border-top:1px solid var(--inkTrack)}
.sw button{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 13px Outfit;color:var(--accentOnInk);border-bottom:4px solid transparent}
.sw button.on{border-bottom-color:var(--accentOnInk)}
.sw .n{font:800 15px Sora;display:inline-flex;align-items:center;gap:6px}.sw .sm{width:14px;height:14px;flex:none}.sw .s-todo{color:var(--sTodo)}.sw .s-doing{color:var(--sDoing)}.sw .s-done{color:var(--sDone)}
.tools{display:flex;align-items:center;gap:4px;padding:12px 16px}
.search{flex:1;min-width:0;height:48px;border:1.5px solid var(--accentD);border-radius:8px;background:var(--white);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--accentD)}
.search input{border:none;background:none;padding:0;min-height:44px;min-width:0;flex:1}
.search input:focus{outline:none}
.search:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.act{display:flex;gap:8px;align-items:center;padding:0 16px 8px;font-size:12px;color:var(--textMuted)}
/* proposal 22 Oct: the place square, the group label, the group row */
.pl{display:grid;place-items:center;align-content:center;text-align:center;flex:none;width:64px;height:64px;border-radius:8px;background:var(--stone);color:var(--text);gap:2px;padding:2px;overflow:hidden}
.pl b{font:800 20px/1 Sora}
.pl i{font:700 11px/1.2 Outfit;font-style:normal;color:var(--textMS)}
.pl span{font:500 12px/1.3 'DM Sans';color:var(--text);overflow-wrap:break-word;hyphens:auto;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
img.pl{object-fit:cover;padding:0}
.ra .gl{display:block;font:700 11px/1.4 Outfit;letter-spacing:1.5px;text-transform:uppercase;color:var(--textMuted);margin-bottom:2px}
.ra .stt{display:inline-flex;align-items:center;gap:4px}
.ra .stt svg,.gr .cts svg{width:14px;height:14px;flex:none}
.gr{align-items:center}
.gr .w{font:700 15px/1.4 Sora}
.gr .cts{display:flex;gap:16px;margin-top:4px;font-size:12px;color:var(--textMid)}
.gr .cts span{display:inline-flex;align-items:center;gap:4px}
.gr .cts b{font:800 15px Sora;color:var(--text)}
.gr .chev,.ra .chev{color:var(--accentD);flex:none}
.zone .what.sm{font:800 20px/1.3 Sora}
.gi{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:8px;background:var(--stone);color:var(--text)}
.gi svg{width:24px;height:24px}
.ra .gl{display:flex!important;align-items:center;gap:6px}
.ra .gl svg{width:14px;height:14px;flex:none}
.zone .gi{background:transparent;color:var(--onInk);border:1px solid var(--inkTrack);width:44px;height:44px}
.sortb{padding:0 16px 12px}
.lh{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 4px}
.lh .t{font:700 11px Outfit;letter-spacing:2px;text-transform:uppercase;color:var(--textMuted)}
.lh .t .n{font:800 11px Sora;letter-spacing:0}
.srt{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 0 0 12px;font:600 13px Outfit;color:var(--accentD)}
.srt svg{width:16px;height:16px}
.ra.c{align-items:center;padding:10px 16px;gap:12px}
/* A job's state is a line on its right: red To do, yellow In progress, green Done (DEC-0337). */
.ra.jt,.cb.jt{border-right:5px solid var(--jTodo)}.ra.jd,.cb.jd{border-right:5px solid var(--jDoing)}.ra.jx,.cb.jx{border-right:5px solid var(--jDone)}.ra.jc,.cb.jc{border-right:5px solid var(--navMid)}
.ra.c .pl{width:60px;height:60px}
.ra.c .pl b{font:800 20px/1 Sora}
.ra.c .w{font-weight:500}
.ra.c .ag{flex:none;text-align:right;min-width:40px}
.ra.c .ag b{display:block;font:800 15px/1.2 Sora;color:var(--text)}
.ra.c .ag i{display:block;font:400 12px 'DM Sans';font-style:normal;color:var(--textMuted)}
.gr .cts{margin-top:2px}
.lh .vw{display:flex;align-items:center;margin-left:auto}
.lh .vw .ib{width:44px;height:44px;border:none;color:var(--textMuted)}
.lh .vw .ib.on{color:var(--accentD)}
.lh .vw .ib svg{width:20px;height:20px}
.tl .tp{display:grid;place-items:center;align-content:center;gap:4px;height:96px;background:var(--stone);text-align:center;padding:8px}
.tl .tp b{font:800 20px/1 Sora}
.tl .tp i{font:700 11px Outfit;font-style:normal;color:var(--textMS)}
.tl .tp span{font:500 13px/1.3 'DM Sans'}
.tl img.tp{width:100%;object-fit:cover;padding:0}
.tl .gl{display:flex;align-items:center;gap:6px;font:700 11px/1.4 Outfit;letter-spacing:1.5px;text-transform:uppercase;color:var(--textMuted);margin-bottom:2px}
.tl .gl svg{width:14px;height:14px;flex:none}
.ra.c .pl span{font:500 12px/1.25 'DM Sans';hyphens:manual;overflow-wrap:normal}
.sortb button{min-height:44px}
.sortb button.on{background:var(--accentD);color:var(--btnText);border-width:1px}
.act .lnk{margin-left:auto}
/* start-up (DEC-0301): the site's tile large, the Waterline mark, the progress naming each step */
.splash{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--cream)}
.splash .mid{flex:1;display:grid;place-items:center;padding-top:env(safe-area-inset-top)}
.tile{width:200px;height:200px;border-radius:12px;background:#FFFFFF;display:grid;place-items:center;border:1px solid var(--border)}
.tile img{width:176px;height:176px;object-fit:contain}
.wm{display:flex;justify-content:center;padding-bottom:32px}
.brand{width:200px;max-width:60vw;height:auto;display:block}
body.t-ni .brand{background:#FFFFFF;border-radius:8px;padding:8px}
.splash .zone{padding-bottom:calc(44px + env(safe-area-inset-bottom))}
.track{height:4px;border-radius:2px;background:var(--inkTrack);margin-top:16px;overflow:hidden}
.fill{height:4px;background:var(--onInk);border-radius:2px;transition:width .3s cubic-bezier(0.16,1,0.3,1)}
.zone p.step{color:var(--onInk)}
@media (prefers-reduced-motion: reduce){ .fill{transition:opacity .44s} }
.zone.logo{display:flex;justify-content:center;padding:24px 16px}

/* a cream top for the tag list inside the scanner */
.top{display:flex;align-items:center;gap:4px;padding:calc(4px + env(safe-area-inset-top)) 8px 4px;background:var(--cream);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--border)}
.top .t{flex:1;font:800 20px Sora;text-align:center}
.ibtn{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--accentD);flex:none}
/* scanner: the camera's own dark surface */
.scan{position:fixed;inset:0;background:var(--ink);color:var(--onInk);z-index:20;display:flex;flex-direction:column}
.scan>.top{background:var(--ink);border-bottom-color:var(--ink)}
.scan>.top .t{color:var(--onInk)}
.scan>.top .ibtn{color:var(--accentOnInk)}
.scan .vf{flex:1;position:relative;overflow:hidden;display:grid;place-items:center}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .frame{position:relative;width:62vmin;height:62vmin;max-width:280px;max-height:280px;border:2px solid var(--onInk);border-radius:16px}
.scan .say{padding:16px;text-align:center;color:var(--onInk)}
.scan .say.err{color:var(--onInk);font-weight:500}
.scan>.foot{background:var(--ink);border-top-color:var(--ink)}
.scan>.foot .btn.g{color:var(--accentOnInk);border-color:var(--accentOnInk)}
.scan .file{position:relative}
.scan .file input{position:absolute;inset:0;opacity:0}
.scan .pick{position:absolute;inset:0;background:var(--cream);color:var(--text);overflow:auto}
/* A short word from the page (John, 21 Oct 2026: not an ill-fitting block): a small pill, centred over the page, in the
   page's own text colour on its cream, so it reads as a passing note in every theme. */
.toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);bottom:calc(96px + env(safe-area-inset-bottom));z-index:30;background:var(--text);color:var(--cream);border-radius:22px;padding:8px 16px;font-size:12px;line-height:1.4;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
/* jobs (P4): a photo where the desk sent one (DEC-0305); a flag as a mark and words, never a colour (DEC-0304; 21.3) */
img.wide{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
img.sm{width:88px;height:88px;object-fit:cover;border-radius:8px;flex:none}
.flg{display:flex;align-items:center;gap:4px;font-size:12px;line-height:1.4;color:var(--text);margin-bottom:4px}
.flg b{font-weight:700}
.zfl{display:flex;gap:8px;align-items:flex-start;margin-top:8px;color:var(--onInk)}
.zfl b{display:block;font-weight:700}
.zfl .why{display:block;color:var(--navMid)}
/* the conversation (DEC-0307 rule 2; 21.4): others' on the white sheet at the left, yours on stone at the right */
.thr{display:flex;flex-direction:column;gap:8px;padding:0 16px}
.dayb{align-self:center;font:700 11px Outfit;letter-spacing:2px;text-transform:uppercase;color:var(--textMuted);padding-top:8px}
.sys{align-self:center;text-align:center;max-width:88%;font-size:12px;line-height:1.4;color:var(--textMid)}
.sys .k,.mh .k{font:700 11px Outfit;letter-spacing:1px;text-transform:uppercase;color:var(--textMuted)}
.msg{display:flex}
.msg.me{justify-content:flex-end}
.bub{max-width:85%;min-width:0;background:var(--white);border:1px solid var(--border);border-radius:12px 12px 12px 4px;padding:8px 12px}
.msg.me .bub{background:var(--stone);border-color:var(--stone);border-radius:12px 12px 4px 12px}
.mh{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:12px;line-height:1.4}
.mh b{font-weight:700}
.bub p{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
img.tp{display:block;width:100%;max-width:280px;border-radius:8px;margin-top:8px}
span.pic.tp{width:200px;height:120px;margin-top:8px}
.mt{font-size:12px;line-height:1.4;color:var(--textMuted);text-align:right;margin-top:4px}
.msg.me .mt,.msg.me .mh .k{color:var(--textMS)}
/* the box at the foot */
.kinds{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.kinds::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 12px;border-radius:22px;border:1px solid var(--accentD);color:var(--accentD);font:600 13px Outfit;white-space:nowrap}
.chip.on{border-width:2px;padding:0 11px}
.cin{display:flex;gap:4px;align-items:flex-end}
.cin textarea{flex:1;min-width:0;min-height:48px;height:48px;resize:none}
.cam input{position:absolute;inset:0;opacity:0;cursor:pointer}
.comp .th{width:64px;height:64px}
/* P6, the opened job (DEC-0317, DEC-0318; mockup sandbox/mockups/job-2026-10-20, round 1). The screen is one column the
   height of the phone: the zone, the photo strip and who is on it stay put; the conversation scrolls between them and the
   message bar (21.6, 21.9). Icons drawn under 24px keep a 1.75 stroke on the 24 grid (21.7). */
.jb{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.jb .zone{flex:none;padding:calc(8px + env(safe-area-inset-top)) 8px 16px 8px}
.jb .ztop{display:flex;align-items:center;gap:4px;margin:0}
.jb .ztop .eb{flex:1;min-width:0;letter-spacing:.08em}
.jb .ztop .eb .mono{font:400 12px ui-monospace,'SFMono-Regular',Consolas,monospace;letter-spacing:0;text-transform:none;color:var(--navMid)}
.jb .zone h1{font:800 20px/1.25 Sora;margin:4px 12px 0;overflow-wrap:anywhere}
.jwh{display:flex;align-items:flex-start;gap:6px;font-size:15px;line-height:1.4;color:var(--navMid);margin:4px 12px 0}
.jwh svg{width:16px;height:16px;stroke-width:2.6;margin-top:3px}
.jfl{display:flex;gap:8px;align-items:flex-start;margin:12px 12px 0;font-size:15px;line-height:1.35;color:var(--onInk)}
.jfl svg{width:18px;height:18px;stroke-width:2.33;margin-top:1px}
.jfl b{font-weight:700}
.zact{display:flex;align-items:center;gap:12px;margin:16px 12px 0}
.jst{flex:1;min-width:0;font-size:15px;line-height:1.3;color:var(--onInk)}
.jst b{display:block;font-weight:700}
.jst span{display:block;font-size:12px;line-height:1.4;color:var(--navMid);margin-top:2px}
.pbtn{height:44px;padding:0 16px;border-radius:8px;background:var(--accentOnInk);color:var(--zBtnText);font:600 13px Outfit;display:flex;align-items:center;gap:8px;flex:none}
.pbtn svg{width:18px;height:18px;stroke-width:2.33}
.pbtn[disabled]{opacity:.6;cursor:default}
.jwhy{font-size:12px;line-height:1.4;color:var(--navMid);margin:8px 12px 0}
.strip{flex:none;display:flex;gap:8px;padding:12px 16px;background:var(--white);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .ph{width:72px;height:72px;border-radius:10px;flex:none;overflow:hidden;background:var(--stone)}
.strip .ph img{width:72px;height:72px;object-fit:cover;display:block}
.strip .ph .pic{width:72px;height:72px;padding:4px;border-radius:0}
.pnc{flex:none;padding:8px 16px;background:var(--white);border-bottom:1px solid var(--border);font-size:12px;line-height:1.4;color:var(--textMuted)}
.people{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 16px;background:var(--white);border-bottom:1px solid var(--border)}
.people .lab{flex:none;font:700 11px Outfit;letter-spacing:.08em;text-transform:uppercase;color:var(--textMid);margin-right:4px}
.people .who{flex:1;min-width:0;font-size:15px;line-height:1.35;padding:6px 0;overflow-wrap:anywhere}
.people .who .none{color:var(--textMuted)}
.people .who .sub{margin-top:2px}
.tbtn{height:44px;padding:0 8px;font:600 13px Outfit;color:var(--accentD);flex:none}
.tw{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.tw .thr{flex:1;justify-content:flex-end;padding:12px 12px 8px;gap:8px}
.jb .dayb{letter-spacing:.08em;margin:4px 0;padding:0}
.ev{align-self:center;display:flex;align-items:flex-start;gap:6px;max-width:92%;font-size:12px;line-height:1.4;color:var(--textMuted);text-align:center}
.ev svg{width:14px;height:14px;stroke-width:3;margin-top:2px}
.jb .msg{flex-direction:column;align-items:flex-start;gap:2px;max-width:82%}
.jb .msg.me{align-self:flex-end;align-items:flex-end}
.jb .bub{max-width:100%;border:0;border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:15px;line-height:1.4}
.jb .msg.me .bub{border-radius:16px 16px 4px 16px}
.jb .bub p{margin:0}
.jb .bub p.nw{color:var(--textMid)}
.kd{display:block;font:700 11px Outfit;letter-spacing:.08em;text-transform:uppercase;color:var(--textMid);margin-bottom:2px}
.meta{font-size:12px;line-height:1.4;color:var(--textMuted);padding:0 4px}
.tpb{display:block;margin:-2px -4px 6px;border-radius:10px;overflow:hidden}
.jb img.tp{width:200px;max-width:100%;height:140px;object-fit:cover;border-radius:10px;margin:0}
.jb span.pic.tp{width:200px;height:140px;margin:0}
.voice{display:flex;align-items:center;gap:8px;min-width:220px;padding:0 4px 0 0}
.vp{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--accentD);color:var(--accentD);display:grid;place-items:center;flex:none}
.vp svg{width:18px;height:18px;fill:currentColor;stroke:none}
.vp[aria-busy=true]{opacity:.5}
.wave{flex:1;min-width:0;display:flex;align-items:center;gap:2px;height:28px;overflow:hidden}
.wave b{width:3px;flex:none;border-radius:2px;background:var(--textMid);opacity:.4}
.wave b.on{opacity:1}
.dur{font:600 12px Sora;color:var(--textMid);font-variant-numeric:tabular-nums;flex:none}
.jbar{flex:none;background:var(--white);border-top:1px solid var(--border);padding:8px 8px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.jbar .bl{display:flex;align-items:flex-end;gap:4px;position:relative}
.jbar .thumbs{padding:0 8px}
.fw{flex:1;min-width:0;min-height:44px;border-radius:8px;border:1px solid var(--textMuted);display:flex;align-items:flex-start;padding:0 4px;background:var(--white)}
.fw:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.fw textarea{flex:1;min-width:0;border:0;border-radius:0;background:none;padding:11px 8px 11px 0;min-height:44px;height:44px;font-size:16px;line-height:1.35;resize:none;overflow-y:auto}
.fw textarea:focus{outline:none}
.ktag{height:44px;display:flex;align-items:center;gap:2px;padding:0 6px 0 10px;font:700 11px Outfit;letter-spacing:.06em;text-transform:uppercase;color:var(--accentD);flex:none;white-space:nowrap}
.ktag svg{width:14px;height:14px;stroke-width:3}
.jbar.w .fw{flex-direction:column;align-items:stretch;border:0;padding:0}
.jbar.w .fw:focus-within{outline:none}
.jbar.w .fw .ktag{align-self:flex-start;height:44px;margin:-6px 0;padding-left:4px}
.jbar.w .fw textarea{flex:none;border:1px solid var(--textMuted);border-radius:8px;padding:11px 12px}
.jbar.w .fw textarea:focus{outline:2px solid var(--accent);outline-offset:2px}
.snd{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--accentD);color:var(--accentD);display:grid;place-items:center;flex:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.snd svg{width:20px;height:20px;stroke-width:2.1}
.snd .i-s{display:none}
.jbar.w .snd .i-m,.jbar.rec-on .snd .i-m{display:none}
.jbar.w .snd .i-s,.jbar.rec-on .snd .i-s{display:block}
/* Recording lies over the field at the field's own size, so nothing on the screen moves under the held finger and the
   keyboard is left as it is: a phone gives up a press when the page shifts under it (John, 21 Oct 2026). */
.rec{position:absolute;left:48px;right:48px;bottom:0;height:46px;z-index:1;display:none;align-items:center;gap:10px;padding:0 4px 0 12px;border-radius:8px;border:1px solid var(--textMuted);background:var(--cream)}
.jbar.rec-on .rec{display:flex}
.jbar.rec-on .fw{opacity:0;pointer-events:none}
.rcan{display:none;height:44px;padding:0 8px;font:600 13px Outfit;color:var(--accentD);flex:none}
.jbar.lk .rcan{display:block}
.dot{width:10px;height:10px;border-radius:5px;flex:none;background:var(--accentD);box-shadow:0 0 0 4px color-mix(in srgb,var(--accentD) 20%,transparent);animation:wlpulse 1.2s ease-in-out infinite}
@keyframes wlpulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accentD) 8%,transparent)}}
@media (prefers-reduced-motion: reduce){ .dot{animation:none} }
.rec .t{font:700 15px Sora;font-variant-numeric:tabular-nums;flex:none}
.rec .s{flex:1;min-width:0;font-size:12px;line-height:1.3;color:var(--textMuted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrev .vh{display:flex;align-items:center;gap:4px;padding-left:4px}
.vrev .vh .voice{flex:1;min-width:0}
.vrev .help{margin:0 8px}
.pick{border:1px solid var(--border);border-radius:8px;background:var(--white);overflow:hidden}
.pick .r{min-height:72px;cursor:pointer}
.pick .r:last-child{border-bottom:none}
.pick .r input{position:absolute;opacity:0;width:1px;height:1px}
.pick .pi{width:44px;height:44px;border-radius:8px;background:var(--stone);display:grid;place-items:center;color:var(--accentD);flex:none}
.chosen .dt{width:48px;height:64px;border-radius:4px;background:var(--stone) center/cover no-repeat;flex:none;border:1px solid var(--border);display:grid;place-items:center;color:var(--accentD)}
.chosen .acts{display:flex;align-items:center}
.field>label.keep{display:flex;gap:12px;font:400 15px/1.4 'DM Sans',sans-serif;color:var(--text);align-items:flex-start;margin-bottom:0}
.field>label.keep input{margin-top:0}
.field>label.keep .m{padding-top:1px}
.keep .m{flex:1;min-width:0}
.why.sq{border-radius:0;border-left:0;border-right:0}
.why{background:var(--white);border:1px solid var(--border);border-radius:8px}
.why .wr{display:block;padding:12px;border-bottom:1px solid var(--border)}
.why .wr:last-child{border-bottom:none}
.why .eb{display:block;color:var(--textMuted);margin-bottom:4px}
.why b{display:block;font:700 15px/1.4 Sora;color:var(--text)}
.why .lw{display:block;line-height:1.5}

/* Messages, the site's chats (job 015 MS2; DEC-0354), drawn to sandbox/mockups/messages-chat-2026-10-24 (b1 to b6). The
   chat app's language is copied, not reinvented (rule 4): a navy head with the desk's wave, a list of chats, bubbles on a
   tinted ground, a bar at the foot. The bar's labels at 1px so five places fit a 360px phone (measured, MS round 1).
   Unread counts are green, a filled oval with a white number (DEC-0355; Design 21.3 cites it), and nowhere else. */
body{--unread:#15803D;--unreadText:#15803D;--avMgr:#0D1F2D;--avAll:#0F5E74;--chatBg:#E9EFF3;--bubMe:#D9F0F5;

body.t-ni{--unreadText:#4ADE80;--avMgr:#1C3A52;--chatBg:#091624;--bubMe:#123A4F;--kWho:#A5B4FC;--kWhat:#93C5FD;--kWhere:#F9A8D4;--kWhy:#E3A57A}

@media (prefers-reduced-motion:reduce){.body>.zone:first-child::after{animation:none}}

<script>
'use strict';
// ── Where captures go ────────────────────────────────────────────────────────────────────────
// One interface, two backings (Work 015 plan, D2a). add(path, blob) never overwrites: it fails with
// code 'exists' if the file is already there (DEC-0265 rule 2). read(path) gives text, or null when
// the file is not there. Nothing on this page deletes, renames or edits a file.
// The real backing is the site's Google relay (DEC-0279, companion/relay.gs): a set-up link from the
// desk carries its address and the site code, kept on this phone. Staff sign in to nothing.
// The sandbox check hands the page an in-memory folder instead.
function testStore(){ try{ return window.parent!==window&&window.parent.wfmTestStore||null; }catch(e){ return null; } }
function b64(blob){ return new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]||''); r.onerror=()=>no(r.error); r.readAsDataURL(blob); }); }
// A set-up link is ?relay=<address>&code=<site code>. It is kept, then taken out of the address bar.
function takeSetupLink(href){
  try{ const q=new URL(href,location.href).searchParams, relay=q.get('relay'), code=q.get('code');
    if(!relay||!code||!/^https:\/\/script\.google\.com\//.test(relay)&&!/^http:\/\/localhost[:\/]/.test(relay)) return false;
    localStorage.setItem('wl_relay',JSON.stringify({url:relay,code:code})); return true; }catch(e){ return false; }
}
function relayStore(){
  if(takeSetupLink(location.href)) history.replaceState(null,'',location.pathname);
  let r=null; try{ r=JSON.parse(localStorage.getItem('wl_relay')||'null'); }catch(e){}
  if(!r||!r.url||!r.code) return null;
  const call=async body=>{
    // text/plain keeps it a simple request, so the browser sends it without a preflight.
    const res=await fetch(r.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({code:r.code},body))});
    let j=null; try{ j=await res.json(); }catch(e){ throw new Error('The site’s relay did not answer properly ('+res.status+')'); }
    if(!j.ok){ const e=new Error(j.why||'The site’s relay refused it'); e.code=j.code; throw e; }
    return j;
  };
  return {
    account:async()=>null,
    add:async(path,blob)=>{ await call({op:'add',path:path,type:blob.type||'',data:await b64(blob)}); },
    // Alerts (DEC-0344): pushConfig, pushRegister and pushTest, as the relay names them.
    ask:call,
    // A read gives up after 20 seconds, so a relay that does not answer never holds the page on "Reading the site
    // details": it opens on the copy kept on this phone and says the desk could not be reached (DEC-0287 rule 3).
    read:async path=>{ let t;
      try{ return (await Promise.race([call({op:'read',path:path}),new Promise((_,no)=>{ t=setTimeout(()=>{ const e=new Error('The site’s relay did not answer in 20 seconds'); e.code='timeout'; no(e); },20000); })])).text; }
      catch(e){ if(e.code==='missing') return null; throw e; }
      finally{ clearTimeout(t); } }
  };
}
const STORE=testStore()||relayStore();

// ── Small helpers ────────────────────────────────────────────────────────────────────────────
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>(n<10?'0':'')+n;
// Design 8.8: DD MMM YYYY and the 24-hour clock.
const day=d=>{d=new Date(d);return pad(d.getDate())+' '+MON[d.getMonth()]+' '+d.getFullYear();};   // DD MMM YYYY (Design 8.8)
const hm=d=>{d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes());};
const when=d=>{const x=new Date(d),t=new Date();return (x.toDateString()===t.toDateString()?'today':day(x))+' at '+hm(x);};
function ago(ms){
  const m=Math.round(ms/6e4);
  if(m<2) return 'just now';
  if(m<60) return m+' minutes ago';
  const h=Math.round(m/60); if(h<48) return h+(h===1?' hour ago':' hours ago');
  return Math.round(h/24)+' days ago';
}
const plural=(n,a,b)=>n+' '+(n===1?a:(b||a+'s'));
function newId(){
  const d=new Date(), r=Math.random().toString(36).slice(2,6).toUpperCase().padEnd(4,'0');
  return 'CAP-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+'-'+r;
}
function device(){
  const u=navigator.userAgent||'';
  const what=/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android phone':'Computer';
  const br=/EdgA?\//.test(u)?'Edge':/CriOS|Chrome\//.test(u)?'Chrome':/FxiOS|Firefox\//.test(u)?'Firefox':/Safari\//.test(u)?'Safari':'a browser';
  return what+', '+br;
}
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
          del(k){try{localStorage.removeItem(k);}catch(e){}}};
const ss={get(k){try{return sessionStorage.getItem(k)||'';}catch(e){return '';}},
          set(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}};

// One icon set on every screen (John, 20 Oct 2026; DEC-0303 rule 8): Lucide (lucide.dev, ISC licence), each
// icon's own path data on its 24px grid at one stroke. The names on the left are what this page calls them.
const LUCIDE={'check-check':'<path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/>',
  'arrow-up':'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',

// ── State ────────────────────────────────────────────────────────────────────────────────────
// Only what this phone needs. Records live in the desk app; this page keeps the site details it
// last read, the captures it has not managed to send, and a short list of what it sent.
const st={screen:'start',site:null,siteAt:0,siteErr:'',account:null,walker:'',pos:'',pid:'',form:null,scanFor:null,outbox:[],busy:false,sheet:false};

// ── The site file (DEC-0271) ─────────────────────────────────────────────────────────────────
// Read, never written. A copy is kept on the phone so it still knows the site when it has no
// signal, and its age is always said (DEC-0271 rule 4).
async function loadSite(){
  const path=WFM_SITE_SHAPE.folder+'/'+WFM_SITE_SHAPE.file;
  let text=null;
  try{ text=await STORE.read(path); st.siteErr=text==null?'missing':''; }
  catch(e){ st.siteErr=e&&e.code==='refused'?'refused':'unreachable'; }
  if(text!=null){
    try{
      const o=JSON.parse(text);
      if(!o||o.format!==WFM_SITE_SHAPE.format) st.siteErr='notsite';
      else if(Number(o.version)>WFM_SITE_SHAPE.version) st.siteErr='newer';
      else { st.site=o; ls.set('wl_site',o); st.siteErr=''; }
    }catch(e){ st.siteErr='broken'; }
  }
  if(!st.site){ const kept=ls.get('wl_site',null); if(kept&&kept.format===WFM_SITE_SHAPE.format) st.site=kept; }
}
// The permits applied for from phones and their answers, as the relay keeps them (DEC-0359 rule 3).
async function loadPerms(){
  if(!STORE) return; const PS=WFM_SITE_SHAPE.permits;
  try{ const t=await STORE.read(PS.folder+'/'+PS.index); if(t!=null){ const o=JSON.parse(t); if(o&&o.format===PS.format&&Array.isArray(o.items)){ st.perms=o; ls.set('wl_perms',o); } } }catch(e){}
  if(!st.perms){ const kept=ls.get('wl_perms',null); if(kept&&Array.isArray(kept.items)) st.perms=kept; }
}
const siteAge=()=>st.site&&st.site.published?Date.now()-Date.parse(st.site.published):Infinity;
const siteStale=()=>!(siteAge()<WFM_SITE_SHAPE.freshHours*36e5);
const points=()=>(st.site&&st.site.points)||[];
const pointById=id=>points().find(p=>p.id===id)||null;
// Every meter a phone can read, from the desk, tagged or not (DEC-0283). A picked meter is shown as a
// point with no tag, so the reading screen is the same one.
const meters=()=>(st.site&&st.site.meters)||[];
const meterAsPoint=id=>{ const m=meters().find(x=>x.id===id); return m?{id:'',name:m.name,where:m.where,rec:{reg:'meterItems',id:m.id,ref:m.id},reading:m.reading,picked:true}:null; };
const lineById=id=>((st.site&&st.site.lines)||[]).find(l=>l.id===id)||null;
const roundById=id=>((st.site&&st.site.rounds)||[]).find(r=>r.id===id)||null;
function pointLabel(p){ return p?(p.name+(p.where?' — '+p.where:'')):''; }

// The site file's line about itself: how old it is, or why there is none.
function siteNote(){
  const pub=st.site&&st.site.published;
  const why={missing:'The desk has not published the site details yet.',unreachable:'The site details could not be reached just now.',refused:'This phone’s site code is not this site’s. Open the latest set-up link from the desk.',
    notsite:'The file in Phone/ is not a site details file.',newer:'The desk published a newer kind of site details than this page reads. Reload the page.',
    broken:'The site details file could not be read. It may still be arriving.'}[st.siteErr]||'';
  if(!st.site) return '<div class="note amber"><span class="eb">No site details</span>'+esc(why)+' You can still report a fault or send a photo in your own words. Lines, outlet ranges and past faults show once the desk publishes them.</div>';
  const age='Published by the desk '+(pub?'<span class="n">'+day(pub)+' at '+hm(pub)+'</span>, '+ago(siteAge()):'at a time it did not say')+'.';
  if(siteStale()) return '<div class="note amber"><span class="eb">Site details out of date</span>'+age+(why?' '+esc(why):'')+' Lines, ranges and past faults may have changed since. The desk republishes every time it reads the Inbox.</div>';
  return '<div class="note"><span class="eb">Site details</span>'+age+(why?' '+esc(why)+' This is the copy kept on this phone.':'')+'</div>';
}

// ── The outbox: captures kept on the phone until they are sent ────────────────────────────────
// IndexedDB, because photos are too big for localStorage. A capture is written here before any
// upload starts, and removed only when its record has landed.
let _db=null, _dbHeld=0;
function db(){
  if(_db) return _db;
  if(Date.now()-_dbHeld<60000) return Promise.reject(new Error('The phone’s store is held by another copy of this page.'));
  // Version 2 adds the photos store: small copies of open jobs' photos, kept once read (DEC-0305, DEC-0308 rule 4).
  _db=new Promise((ok,no)=>{ const r=indexedDB.open('waterline-capture',2);
    r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox',{keyPath:'id'}); if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos'); };
    // Another copy of this page open on the phone can hold the store while it upgrades. Give up after 5 s and try
    // again next time rather than wait for ever; and let a newer copy take the store from this one.
    const t=setTimeout(()=>{ _db=null; _dbHeld=Date.now(); no(new Error('The phone’s store is held by another copy of this page.')); },5000);
    r.addEventListener('success',()=>{ clearTimeout(t); r.result.onversionchange=()=>{ r.result.close(); _db=null; }; });
    r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); });
  return _db;
}

// Files first, the record last, so the desk lists a capture only once everything is there (slice A).
// A file already there was sent on an earlier try: ids are new for every capture.
async function deliver(c){
  const put=async(path,blob)=>{ try{ await STORE.add(path,blob); }catch(e){ if(!(e&&e.code==='exists')) throw e; } };
  for(const f of c.files){
    if(c.done.indexOf(f.name)>=0) continue;
    await put('Inbox/'+f.name,f.blob);
    c.done.push(f.name); await keep(c);
  }
  await put('Inbox/'+c.id+'.json',new Blob([JSON.stringify(c.record,null,1)],{type:'application/json'}));
}
// Kept in the outbox; if the phone's store is held by another copy of the page, sent straight away all the same.
const keep=c=>obPut(c).catch(e=>console.warn('outbox',e));
async function send(c){
  await keep(c);
  try{ await deliver(c); }
  catch(e){ console.warn('send',e); c.err=String(e&&e.message||e); c.errCode=e&&e.code||'';
    if(c.errCode==='notissuer'){ await obDel(c.id).catch(()=>{}); return false; }
    await keep(c); return false; }
  await obDel(c.id).catch(()=>{}); return true;
}
async function sendKept(){
  if(st.busy) return; st.busy=true;
  const all=await obAll().catch(()=>[]); let n=0;
  for(const c of all){ if(await send(c)) n++; }
  st.outbox=await obAll().catch(()=>st.outbox); st.busy=false;
  return n;
}

function kindLabel(k){ return (WFM_CAPTURE_SHAPE.kinds[k]||{}).label||k; }
function summary(r){
  if(r.kind==='round'){ const rd=roundById(r.round); return (rd?rd.name:'Round')+', '+plural((r.scans||[]).length,'point')+' scanned'; }
  if(r.kind==='reading'){ const p=r.point?pointById(r.point):(r.record?meterAsPoint(r.record.id):null); return 'Reading at '+(p?p.name:r.place||'a tag'); }
  if(r.kind==='certificate'){ const l=lineById(r.duty); return kindLabel('certificate')+(l?' for '+l.what:''); }
  const p=r.point?pointById(r.point):null;
  return kindLabel(r.kind)+(p?' at '+pointLabel(p):r.place?' at '+r.place:r.point?' at tag '+r.point:'');
}
async function shrink(file){
  // Camera photos run to several megabytes; a long edge of 2400px keeps a certificate readable on the
  // desk and the upload small on mobile data. Anything that is not a photo is sent as it is.
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try{
    const bm=await createImageBitmap(file), k=Math.min(1,2400/Math.max(bm.width,bm.height));
    if(k===1&&file.size<1.5e6) return file;
    const cv=document.createElement('canvas'); cv.width=Math.round(bm.width*k); cv.height=Math.round(bm.height*k);
    cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
    return await new Promise(ok=>cv.toBlob(b=>ok(b||file),'image/jpeg',.85));
  }catch(e){ return file; }
}
function extOf(blob,name){
  const t=blob.type||'';
  if(t==='image/jpeg') return 'jpg'; if(t==='image/png') return 'png'; if(t==='image/webp') return 'webp';
  if(t==='application/pdf') return 'pdf'; if(t==='image/heic') return 'heic';
  if(/^audio\/mp4/.test(t)) return 'm4a'; if(/^audio\/webm/.test(t)) return 'webm';
  const m=/\.([a-z0-9]{2,5})$/i.exec(name||''); return m?m[1].toLowerCase():'bin';
}
async function makeCapture(kind,fields,photos){
  const id=newId(), files=[];
  for(let i=0;i<photos.length;i++){
    // A signature is kept as it was drawn (S5): never shrunk or turned into a JPEG.
    const b=photos[i].keep?photos[i].file:await shrink(photos[i].file), name=id+'-'+(i+1)+'.'+extOf(b,photos[i].file.name);
    files.push({name:name,blob:b,type:b.type||'application/octet-stream'});
  }
  const rec={format:WFM_CAPTURE_SHAPE.format,version:WFM_CAPTURE_SHAPE.version,id:id,kind:kind,
    taken:fields.taken||new Date().toISOString(),person:st.walker,account:st.account?st.account.username:'',device:device()};
  // The fields the shape names, read from it (Principles, Law 3): a field added on the desk travels without a list here.
  WFM_CAPTURE_SHAPE.fields.filter(k=>!(k in rec)&&k!=='files').forEach(k=>{ const v=fields[k]; if(v!=null&&v!==''&&!(Array.isArray(v)&&!v.length)) rec[k]=v; });
  rec.files=files.map(f=>({name:f.name,type:f.type,bytes:f.blob.size}));
  if(rec.sig){ const k=photos.findIndex(p=>p.sig); if(k>=0) rec.sig=Object.assign({},rec.sig,{file:files[k].name}); else delete rec.sig; }
  // Every field written is one the shape names: the desk is the judge of the contract.
  Object.keys(rec).forEach(k=>{ if(WFM_CAPTURE_SHAPE.fields.indexOf(k)<0) throw new Error('Not in the capture shape: '+k); });
  return {id:id,record:rec,files:files,done:[],made:Date.now()};
}

// Read from what the desk published; the phone judges nothing. Walks by their walker, lines by the

// line naming no one or a duty nobody holds.
function dueFor(){
  const s=SITE(), p=myPos(), fm=isFM(p), now=Date.now(), held=new Set(p?p.duties:[]), groups=new Set(p?(p.groups||[]):[]);
  const over=[], today=[], soon=[];
  const mine=r=>fm||(p&&(r.by===p.id||r.by==='dept:'+p.department));
  (s.rounds||[]).filter(mine).forEach(r=>{
    const it=(s.due||[]).find(i=>i.round===r.id), w=it&&it.walk;
    if(w&&w.open) today.push({t:'walk',r:r,from:Date.parse(w.open.at),to:Date.parse(w.open.end),now:true});
    (r.times||[]).forEach(t=>{ const a=timeToday(t); if(a>now){ const n=nextTime(r,t); let b=timeToday(n); if(b<=a) b+=864e5; today.push({t:'walk',r:r,from:a,to:b}); } });
  });

    const ds=i.duties||[];
    if(!(ds.some(d=>held.has(d))||(fm&&(!ds.length||i.nobody)))) return;

function t5FinWhy(j){ const D=st.form.fin, qs=t5FinQs(j), un=qs.filter(f=>D.ans[f.id]==null);
  if(un.length) return 'Answer '+(un.length===1?'“'+un[0].q+'”':'each question')+'.';
  const nw=qs.find(f=>f.ask&&D.ans[f.id]===f.ask); if(nw&&!String(st.form.t5found||'').trim()) return 'Say what you found.';
  if(!D.strokes.length) return 'Sign with your finger.'; return ''; }
// The signature pad: strokes kept in the form so a redraw keeps them, drawn again on each render.
function t5SigBind(){ const cv=document.getElementById('t5sig'); if(!cv) return; const D=st.form.fin, r=cv.getBoundingClientRect(), k=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*k); cv.height=Math.round(r.height*k); const g=cv.getContext('2d'); g.scale(k,k);
  const ink=getComputedStyle(cv).color; g.strokeStyle=ink; g.lineWidth=2.5; g.lineCap='round'; g.lineJoin='round';
  const paint=s=>{ g.beginPath(); s.forEach((p,i)=>i?g.lineTo(p[0]*r.width,p[1]*r.height):g.moveTo(p[0]*r.width,p[1]*r.height)); if(s.length===1) g.lineTo(s[0][0]*r.width+.1,s[0][1]*r.height); g.stroke(); };
  D.strokes.forEach(paint);
  let cur=null; const pt=e=>{ const b=cv.getBoundingClientRect(); return [Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),Math.min(1,Math.max(0,(e.clientY-b.top)/b.height))]; };
  cv.onpointerdown=e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); cur=[pt(e)]; D.strokes.push(cur); };
  cv.onpointermove=e=>{ if(!cur) return; cur.push(pt(e)); g.clearRect(0,0,r.width,r.height); D.strokes.forEach(paint); };
  cv.onpointerup=cv.onpointercancel=()=>{ if(!cur) return; cur=null; D.at=new Date().toISOString(); const y=document.querySelector('.tf').scrollTop; keepRender(); const t=document.querySelector('.tf'); if(t) t.scrollTop=y; }; }
// The signature as a PNG of its own, black on clear, 600 × 200 (Records §7: kept as the evidence it is).
function t5SigPng(){ const D=st.form.fin, cv=document.createElement('canvas'); cv.width=600; cv.height=200; const g=cv.getContext('2d');
  g.strokeStyle='#0D1F2D'; g.lineWidth=4; g.lineCap='round'; g.lineJoin='round';
  D.strokes.forEach(s=>{ g.beginPath(); s.forEach((p,i)=>i?g.lineTo(p[0]*600,p[1]*200):g.moveTo(p[0]*600,p[1]*200)); if(s.length===1) g.lineTo(s[0][0]*600+.1,s[0][1]*200); g.stroke(); });
  return new Promise(res=>cv.toBlob(b=>res(new File([b],'signature.png',{type:'image/png'})),'image/png')); }

// Sends one job update and stays on the job. Kept in wl_jobSent so the thread shows it as sent until it is filed.
async function jobSend(act){

  const V=act==='voice'?F.voice:null; if(act==='voice'&&!V) return;

  if(act==='note'){ fields.msgKind=F.kind||'Note'; fields.note=String(F.note||'').trim(); photos=F.photos; }
  if(act==='edit'){ fields.entry=F.mid; fields.note=String(F.etext||'').trim(); }
  if(act==='delete') fields.entry=F.mid;
  if(V){ fields.msgKind=F.kind||'Note'; fields.note=String(V.words||'').trim(); fields.secs=V.secs; photos=[{file:new File([V.blob],'voice.'+(V.type==='audio/mp4'?'m4a':'webm'),{type:V.type})}]; }
  if(act==='flag') fields.flag={level:F.level,why:String(F.why||'').trim()};
  if(act==='done'){ fields.note=String(F.dnote||'').trim(); photos=F.dphotos||[]; fields.parts=partsOut(F).v; }
  if(act==='parts') fields.parts=partsOut(F).v;
  if((act==='start'||act==='restart'||act==='permit')&&F.ck) fields.check=ckOut(F.ck);
  // The types go with it for the alert's words only (DEC-0344); the desk works them out again from the check.
  if(act==='permit'){ F.ckNeed=ckMissing(j,F.ck); fields.permit={from:F.pfrom||'',to:F.pto||'',fields:Object.assign({},F.pf||{}),types:F.ckNeed.slice()}; }
  // An answer to a permit (DEC-0359): the application by its capture id and the register ids the desk gave it.
  if(act==='permitissue'||act==='permitrefuse'){ const g=permAsk(j); if(!g||!canIssue()){ st.sheet=false; return render(); }
    F.pa={ref:g.cap,ids:g.ids,types:g.types,why:act==='permitrefuse'?String(F.prwhy||'').trim():''};
    fields.ref=g.cap; fields.permit={ids:g.ids,types:g.types}; if(F.pa.why) fields.permit.why=F.pa.why; }
  if(act==='pause') fields.note=String(F.pwhy||'').trim();
  if(act==='stop'){ const C=F.ck, q=C&&C.stopQ; fields.stopped={why:C.stop.why}; photos=C.stop.photos;
    fields.note=[q?'At “'+q+'”.':'',String(F.t5word||'').trim()].filter(Boolean).join(' '); }
  if(act==='done'){ const D=F.fin; fields.finish={answers:t5FinQs(j).map(f=>({id:f.id,q:f.q,a:D.ans[f.id]})),found:String(F.t5found||'').trim()};
    if(D.strokes.length){ photos=photos.concat([{file:await t5SigPng(),keep:true,sig:true}]); fields.sig={file:'',by:st.walker,at:D.at||new Date().toISOString()}; } }
  if(act==='assign') fields.assign=F.asgSend;

  let c;
  try{ c=await makeCapture('job',fields,photos); }
  catch(e){ st.busy=false; st.sheet=false; F.err='Nothing was sent. Try again; if it happens twice, tell the desk. ('+(e.message||e)+')'; return render(); }
  const ok=await send(c); st.outbox=await obAll().catch(()=>st.outbox); st.busy=false;
  if(!ok&&c.errCode==='notissuer'){ st.sheet=false; render(); return toast('Not sent: '+c.err); }
  const s=jSent(); s.push({cap:c.id,job:j.id,act:fields.act,kind:fields.msgKind||'',note:fields.note||'',flag:fields.flag||null,assign:fields.assign||null,at:c.record.taken,by:st.walker,n:c.files.length,au:V?V.secs:0,entry:fields.entry||'',parts:fields.parts||null,types:act==='permit'?F.ckNeed||[]:null,
    hz:fields.check&&!fields.check.none?fields.check.hazards.map(h=>h.id):null,stopped:fields.stopped||null,pa:F.pa||null}); ls.set('wl_jobSent',s);
  _sentPics[c.id]=V?[]:photos.map(p=>p.url).filter(Boolean);   // shown in its bubble while the page is open
  if(V){ _sentAudio[c.id]={url:V.url,secs:V.secs}; F.voice=null; F.kind='Note'; st.twEnd=true; }
  if(act==='edit'||act==='delete'){ F.mid=''; F.etext=''; F.eerr=''; }
  if(act==='note'){ F.note=''; F.photos=[]; F.kind='Note'; st.twEnd=true; }   // the kind is chosen for each entry, so a note is never filed under the last one's
  if(act==='done'||act==='parts'){ F.dnote=''; F.dphotos=[]; F.ptext=''; F.ptried=false; F.fin=null; F.t5found=''; }

// Corners dragged with a finger, a magnifier above the finger while it moves; Retake marks which page it replaces.
function dsBind(){
  const D=st.ds;
  app.querySelectorAll('.ds label[data-redo]').forEach(l=>l.addEventListener('click',()=>{ D.redo=Number(l.dataset.redo); }));
  app.querySelectorAll('.ds label:not([data-redo]) input[data-file="scanshot"]').forEach(i=>i.addEventListener('click',()=>{ D.redo=null; }));
  const svg=document.getElementById('dsq'); if(!svg) return;
  const pg=D.pages[D.cur], lp=document.getElementById('dsl'), poly=svg.querySelector('polygon.pf'), edge=svg.querySelector('polygon.pe'); let on=null;
  // Handles 28px and lines 3px on screen, whatever the photo's size (the touch target is 48px round each, below).
  const u=1/svg.getScreenCTM().a; poly.setAttribute('stroke-width',3*u); edge.setAttribute('stroke-width',6*u);
  svg.querySelectorAll('circle[data-c]').forEach(c=>{ c.setAttribute('r',14*u); c.setAttribute('stroke-width',2.5*u); }); svg.querySelectorAll('circle.ce').forEach(c=>{ c.setAttribute('r',14*u); c.setAttribute('stroke-width',5.5*u); });
  const at=e=>{ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  svg.addEventListener('pointerdown',e=>{ const p=at(e), sc=svg.getScreenCTM().a; let best=null, bd=1e9;
    ['tl','tr','br','bl'].forEach(c=>{ const d=Math.hypot(pg.q[c].x-p.x,pg.q[c].y-p.y); if(d<bd){ bd=d; best=c; } });
    // A press away from every handle moves the nearest corner there: the single-pointer way (Design 12.9).
    if(bd*sc>48){ pg.q[best]={x:p.x,y:p.y}; D.stage='corners'; render(); return; }
    on=best; svg.setPointerCapture(e.pointerId); e.preventDefault(); });
  svg.addEventListener('pointermove',e=>{ if(!on) return; const p=at(e), W=pg.img.width, H=pg.img.height;
    pg.q[on]={x:Math.max(0,Math.min(W,p.x)),y:Math.max(0,Math.min(H,p.y))};
    ['[data-c="'+on+'"]','[data-e="'+on+'"]'].forEach(sel=>{ const c=svg.querySelector(sel); c.setAttribute('cx',pg.q[on].x); c.setAttribute('cy',pg.q[on].y); });
    const pts=[pg.q.tl,pg.q.tr,pg.q.br,pg.q.bl].map(v=>v.x.toFixed(0)+','+v.y.toFixed(0)).join(' '); poly.setAttribute('points',pts); edge.setAttribute('points',pts);
    const z=3*svg.getScreenCTM().a;
    lp.style.display='block'; lp.style.backgroundImage='url('+pg.view+')'; lp.style.backgroundSize=(W*z)+'px '+(H*z)+'px';
    lp.style.backgroundPosition=(52-pg.q[on].x*z)+'px '+(52-pg.q[on].y*z)+'px';
    lp.style.left=(on==='tl'||on==='bl')?'auto':'8px'; lp.style.right=(on==='tl'||on==='bl')?'8px':'auto'; });
  const up=()=>{ on=null; lp.style.display='none'; };
  svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
}

// Digits typed as they read across a dial, with the point put in its place (DEC-0284). The desk's

    +'<div class="field"><label for="f-value">'+esc(what)+'</label><label class="fig"><input id="f-value" type="text" inputmode="'+(dp?'numeric':'decimal')+'" autocomplete="off" placeholder="–" value="'+esc(F.value||'')+'" data-in="value"><span class="u">'+esc(r.unit||'')+'</span></label>'
    +(typedBad?'<div class="help err" role="alert">Enter the figure as the '+(r.dial?'dial':'meter')+' shows it, with no spaces or commas, like 285312.1.</div>'

      :'<div class="help">'+esc((dp?'':(r.says||''))+how)+' '+(p.picked?'Picked from the list, not scanned at the meter, and the record says so. ':'')+'Added to the meter on the desk when it files.</div>')+'</div>'
    +photosField(r.dial?'Photo of the dial':'Photo of the gauge',true)+'<div style="height:24px"></div></div>'

// ── NFC tags (DEC-0345): a tag is known by its own serial, read here and never written ──────────

function linksKept(){

  if(Object.keys(out).length!==Object.keys(k).length) ls.set('wl_links',out);

async function decodeFrom(src,w,h){

async function doSend(){

async function chatSeen(){
  const F=st.form; if(!F) return;
  if(st.screen!=='chat') return;
  const L=chatMsgs(F.chat).filter(x=>x.kind!=='chatphoto'&&!x.deleted&&!byMe(x)), S0=seenSet(), fresh=L.filter(x=>!S0.has(x.id)&&!myRead(x.id).opened);

}
function chatBottom(){ requestAnimationFrame(()=>window.scrollTo(0,document.documentElement.scrollHeight)); }
async function chatAfterSend(){ const F=st.form; F.photos.forEach(p=>p.url&&URL.revokeObjectURL(p.url)); Object.assign(F,{ctext:'',photos:[],voice:null,mode:'',tried:false,pick:{},adds:null,ntTitle:'',ntText:'',replyTo:''}); render(); chatBottom(); }
async function chatSend(){
  const F=st.form, c=chatById(F.chat); if(!c||st.busy) return;
  const text=String(F.ctext||'').trim(), urls=F.photos.map(p=>p.url);
  const files=F.photos.map(p=>({file:p.file})).concat(F.voice?[{file:new File([F.voice.blob],'voice',{type:F.voice.type})}]:[]);
  const keep=r=>{ if(r&&urls.length){ _msgPics[r.id]=urls; F.photos=[]; } if(r&&F.voice) _sentAudio[r.id]={url:F.voice.url}; };
  if(F.mode==='ho'){
    const parts={}; CS.handoverParts.forEach(p=>{ const v=String(F['p_'+p.k]||'').trim(); if(v) parts[p.k]=v; });
    const A=F.adds, adds={permits:A.permits.filter((p,i)=>F.pick['pm'+i]),started:A.started.filter((s,i)=>F.pick['st'+i]).map(s=>({id:s.id,no:s.no,title:s.title,where:s.where})),doneToday:A.doneToday,olderInProgress:A.olderInProgress};
    if(!Object.keys(parts).length&&!adds.permits.length&&!adds.started.length&&!files.length&&!text){ F.tried=true; return render(); }
    const r=await msgSend('handover',{handover:{chat:c.id,to:[c.id],dept:myDept(),parts:parts,adds:adds},secs:F.voice?F.voice.secs:null},files,false); if(!r) return;
    keep(r); if(text) await msgSend('msg',{msg:{chat:c.id,text:text}},[],false);
    return chatAfterSend();
  }
  if(F.mode==='nt'){
    const title=String(F.ntTitle||'').trim(), body=String(F.ntText||'').trim();
    if(!title&&!body){ F.tried=true; return render(); }
    const r=await msgSend('notice',{notice:{chat:c.id,to:[c.id],title:title||body.split('\n')[0],text:title?body:body.split('\n').slice(1).join('\n').trim(),confirm:!!F.confirm}},[],false); if(!r) return;
    if(text) await msgSend('msg',{msg:{chat:c.id,text:text}},[],false);
    return chatAfterSend();
  }
  if(!text&&!files.length) return;
  const r=F.replyTo?await msgSend('reply',{ref:F.replyTo,msg:{chat:c.id,text:text},secs:F.voice?F.voice.secs:null},files,false)
    :await msgSend('msg',{msg:{chat:c.id,text:text},secs:F.voice?F.voice.secs:null},files,false);
  if(!r) return; keep(r); return chatAfterSend();
}
// A voice note: press the microphone to record, the square to stop, up to soundMaxSecs; then it waits beside Send.
async function hoVoice(){
  const F=st.form;
  if(st.hoRec){ const R=st.hoRec; st.hoRec=null; clearTimeout(R.cap);
    R.mr.onstop=()=>{ R.s.getTracks().forEach(t=>t.stop()); const mt=String(R.mr.mimeType||(R.chunks[0]&&R.chunks[0].type)||''), type=/mp4/.test(mt)?'audio/mp4':'audio/webm', blob=new Blob(R.chunks,{type:type});
      if(F.voice&&F.voice.url) URL.revokeObjectURL(F.voice.url);
      F.voice={blob:blob,type:type,secs:Math.min(CS.soundMaxSecs,Math.max(1,Math.round((Date.now()-R.t0)/1000))),url:URL.createObjectURL(blob)}; _sentAudio.cv={url:F.voice.url}; keepRender(); };
    try{ R.mr.stop(); }catch(e){ R.mr.onstop(); } return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder) return toast('This phone cannot record sound on this page. Write it instead.');
  let s; try{ s=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ return toast('The microphone is not allowed for this page. Allow it in the phone’s settings, or write it.'); }
  const type=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  let mr; try{ mr=new MediaRecorder(s,type?{mimeType:type}:undefined); }catch(e){ s.getTracks().forEach(t=>t.stop()); return toast('This phone would not record sound. Write it instead.'); }
  const R={mr:mr,s:s,chunks:[],t0:Date.now()}; mr.ondataavailable=ev=>{ if(ev.data&&ev.data.size) R.chunks.push(ev.data); }; mr.start(1000); st.hoRec=R;
  R.cap=setTimeout(()=>{ if(st.hoRec===R) hoVoice(); },CS.soundMaxSecs*1000);
  keepRender();
}

  if(a==='chatBack'){ const k=st.chatLast||(F&&F.chat); st.form=chatForm(typeof k==='string'?k:(k&&k.chat)); st.chatLast=null; go('chat'); return chatBottom(); }
  if(a==='chatInfo'){ st.chatLast=F.chat; st.form={chat:F.chat}; return go('chatinfo'); }
  if(a==='chatNew'||a==='chatPick'){ if(F) F.pickFor=a==='chatPick'?b.dataset.for:''; else st.form={pickFor:''}; st.sheet='chatpick'; render(); const v=app.querySelector('.sheet .c-pk'); if(v) v.focus(); return; }
  if(a==='chatPicked'){ st.sheet=false; if(F&&F.pickFor==='ho'&&st.screen==='chat'){ F.chat=b.dataset.id; return render(); } st.form=chatForm(b.dataset.id); go('chat'); chatBottom(); await chatSeen(); return render(); }
  if(a==='replyTo'){ F.replyTo=b.dataset.id; F.mode=''; render(); chatBottom(); const t=document.getElementById('ctext'); if(t) t.focus(); return; }
  if(a==='replyOff'){ F.replyTo=''; return render(); }
  if(a==='jumpTo'){ const el=app.querySelector('.c-b[data-mid="'+CSS.escape(b.dataset.id)+'"]'); if(el){ el.scrollIntoView({block:'center',behavior:'instant'}); el.classList.add('c-hl'); setTimeout(()=>el.classList.remove('c-hl'),1200); } return; }
  if(a==='ntAck'||a==='hoAck'){ await msgSend('msgread',{ref:b.dataset.id,act:'confirmed'},[],a==='ntAck'?'Kept with the notice':'Kept with the handover'); return render(); }
  if(a==='ntRemind'){ await msgSend('notice',{remind:b.dataset.id},[],'Reminder sent to those not confirmed'); return render(); }
  if(a==='cAttach'){ st.sheet='cattach'; render(); const v=app.querySelector('.sheet .verb'); if(v) v.focus(); return; }
  if(a==='cModeHo'){ st.sheet=false; F.mode='ho'; F.adds=hoAdds(); F.pick={}; F.adds.permits.forEach((p,i)=>{ F.pick['pm'+i]=true; }); F.tried=false; render(); const t=document.getElementById('ho-who'); if(t) t.focus(); return; }
  if(a==='cModeNt'){ st.sheet=false; F.mode='nt'; F.tried=false; render(); const t=document.getElementById('nt-title'); if(t) t.focus(); return; }
  if(a==='cModeOff'){ F.mode=''; F.tried=false; return render(); }
  if(a==='hoPick'){ F.pick[b.dataset.k]=!F.pick[b.dataset.k]; return render(); }
  if(a==='cPhotoDel'){ const p=F.photos.splice(Number(b.dataset.i),1)[0]; if(p&&p.url) URL.revokeObjectURL(p.url); return render(); }
  if(a==='cVoiceDel'){ if(F.voice&&F.voice.url) URL.revokeObjectURL(F.voice.url); F.voice=null; return render(); }
  if(a==='cReaders'){ st.sheet='readers'; render(); const c=app.querySelector('.sheet [data-act="sheetClose"]'); if(c) c.focus(); return; }
  if(a==='cEdit'){ const x=cMine(); if(!x) return; F.etext=String((x.msg&&x.msg.text)||''); F.eerr=''; st.sheet='cedit'; render(); const t=document.getElementById('etext'); if(t) t.focus(); return; }
  if(a==='cEditSend'){ const x=cMine(); if(!x) return; const t=String(F.etext||'').trim();
    if(!t&&!picsOf(x).length){ F.eerr='Write something, or delete the message instead.'; return render(); }
    st.sheet=false; if(t===String((x.msg&&x.msg.text)||'').trim()) return render();
    await msgSend('msgchange',{ref:x.id,act:'edit',chat:chatOf(x),msg:{text:t}},[],'Edited. The desk keeps what it said before.'); return render(); }
  if(a==='cDel'){ st.sheet='cdel'; render(); const v=app.querySelector('.sheet .btn.p'); if(v) v.focus(); return; }
  if(a==='cDelSend'){ const x=cMine(); if(!x) return; st.sheet=false; await msgSend('msgchange',{ref:x.id,act:'delete',chat:chatOf(x)},[],'Deleted. The desk keeps what it said.'); return render(); }
  if(a==='cGo'){ if(st.hoRec) return hoVoice(); if(String(F.ctext||'').trim()||F.photos.length||F.voice||F.mode) return chatSend(); return hoVoice(); }
}
// Swipe a message to the right to reply under it (rule 4); a long press on your own opens Edit, Delete and Who Read It.
let _sw=null;
app.addEventListener('touchstart',e=>{ const b=e.target.closest('.c-b[data-sw]'); _sw=b&&e.touches.length===1?{id:b.dataset.sw,x:e.touches[0].clientX,y:e.touches[0].clientY,el:b}:null; },{passive:true});
app.addEventListener('touchmove',e=>{ if(!_sw) return; const dx=e.touches[0].clientX-_sw.x, dy=Math.abs(e.touches[0].clientY-_sw.y); if(dy>30){ _sw.el.style.transform=''; _sw=null; return; } if(dx>0) _sw.el.style.transform='translateX('+Math.min(dx,72)+'px)'; },{passive:true});
app.addEventListener('touchend',e=>{ if(!_sw) return; const S0=_sw; _sw=null; S0.el.style.transform=''; const dx=(e.changedTouches[0]||{}).clientX-S0.x;
  if(dx>64&&st.screen==='chat'){ st.form.replyTo=S0.id; st.form.mode=''; render(); chatBottom(); const t=document.getElementById('ctext'); if(t) t.focus(); } });
let _clp=null;
let _clpHeld=false;
// The click a long press ends with is not a click, however long the finger stays down: the window starts again as it lifts.
const cmOpen=id=>{ if(st.sheet||!st.form) return; _lpAt=Date.now(); _clpHeld=true; st.form.rid=id; st.sheet='cmsg'; render(); const v=app.querySelector('.sheet .verb'); if(v) v.focus(); };
app.addEventListener('pointerdown',e=>{ const b=e.target.closest('.c-b[data-rd]'); if(!b||e.button>0||e.target.closest('button,audio,input,textarea,label')) return; const id=b.dataset.rd;
  _clp={x:e.clientX,y:e.clientY,t:setTimeout(()=>{ _clp=null; cmOpen(id); },500)}; });
app.addEventListener('pointermove',e=>{ if(_clp&&Math.hypot(e.clientX-_clp.x,e.clientY-_clp.y)>10){ clearTimeout(_clp.t); _clp=null; } });
['pointerup','pointercancel'].forEach(t=>app.addEventListener(t,()=>{ if(_clp){ clearTimeout(_clp.t); _clp=null; } if(_clpHeld){ _clpHeld=false; _lpAt=Date.now(); } }));
app.addEventListener('contextmenu',e=>{ const b=e.target.closest('[data-rd]'); if(!b||!st.form) return; e.preventDefault(); if(_clp){ clearTimeout(_clp.t); _clp=null; } cmOpen(b.dataset.rd); });
async function home(){
  st.outbox=await obAll().catch(()=>st.outbox);
  if(st.outbox.length&&navigator.onLine!==false) await sendKept();
  jSentPrune(); phPrune().catch(()=>{});
  if(st.screen==='start'){ bootStep(3,'Ready'); await new Promise(r=>setTimeout(r,300)); }
  const walk=ls.get('wl_walk',null);
  if(walk&&walk.round&&roundById(walk.round)){ st.form=Object.assign({unscanned:[],ans:{},photos:[]},walk); return go('walk'); }
  go('due');
}
async function boot(){
  document.body.className='t-'+theme();
  render();
  if(!STORE){ st.form={link:''}; return go('setup'); }
  st.account=await STORE.account();
  bootStep(1,'Reading the site details');
  await Promise.all([loadSite(),loadMsgs(),loadPerms()]); msgSentPrune();
  bootStep(2,'Checking what is waiting to send');
  const w=whoGet(); st.walker=w&&w.name||''; st.pos=w&&w.pos||''; st.pid=w&&w.pid||'';
  if(!st.walker||!st.pos) return go('who');
  await home();
  if(LINK_JOB) jobFromLink(LINK_JOB);
  alertsKeep();
}
const LINK_JOB=new URLSearchParams(location.search).get('job')||'';
// Opens the job an alert names, with the permit to review on top for whoever can issue it. The address is put back to the
// page's own, so a reload opens Due.
function jobFromLink(id){
  try{ if(/[?&]job=/.test(location.search)) history.replaceState(null,'',location.pathname); }catch(e){}
  if(['start','setup','who'].indexOf(st.screen)>=0) return;
  const j=jobById(id); if(!j) return toast('That job is no longer on the phone.');
  st.form={id:j.id,prwhy:''}; st.place='due'; st.sheet=canIssue()&&permAsk(j)?'jreview':false; go('job');
}
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message',e=>{ const l=e.data&&e.data.open; if(!l) return;
  try{ const id=new URL(l,location.href).searchParams.get('job'); if(id) jobFromLink(id); }catch(x){} });
// For the sandbox check only: lets it scan without a camera. Absent unless the page runs in the check.
if(STORE) window.wfmPhoneTest={scanned:scanned,state:st,render:render,siteRefresh:siteRefresh,msgRefresh:msgRefresh};
// Keeps the page itself on the phone so it opens with no signal (DEC-0287 rule 3). Not in the check.
if('serviceWorker' in navigator&&!testStore()&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
